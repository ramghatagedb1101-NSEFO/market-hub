name: diag-one-off

# One-off diagnostic runs, triggered by pushing a change to triggers/diag.txt. Prints to the
# Actions log only -- nothing is published or committed. Safe to re-run; delete when no longer needed.
on:
  push:
    branches: [main]
    paths: ["triggers/diag.txt"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Library pipeline sample (10 companies, full detail)
        env:
          BHARATSTOCK_API_KEY: ${{ secrets.BHARATSTOCK_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m hub.diag_library_sample
