name: live-quotes

# Every 5 minutes during Indian market hours (08:30–16:30 IST, Mon–Fri).
on:
  schedule:
    - cron: "*/5 3-11 * * 1-5"    # 03:00–11:55 UTC = 08:30–17:25 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's Kite access token from the relay
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          # Google occasionally serves a transient "Drive: Page Not Found" page for an Apps Script
          # web app call even when the script and the token are both fine (same retry already in
          # daily.yml/expiry-theta.yml since 8 Oct) -- this workflow is the one that actually hit it
          # live (run 37746344330, curl exit 22) because it was still a single unretried shot, running
          # every 5 minutes during market hours made it just a matter of time. Shorter backoff than
          # daily.yml's: this job has a 5-minute total budget.
          TOKEN=""
          for attempt in 1 2 3; do
            RESP=$(curl -sSL -G "$RELAY_URL" -w " HTTP:%{http_code}" --data-urlencode "mode=token" --data-urlencode "key=$RELAY_KEY" || true)
            TOKEN=$(echo "$RESP" | sed 's/ HTTP:[0-9]*$//' | python -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then break; fi
            echo "Attempt $attempt: no token yet. Relay answered: $RESP"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          if [ -z "$TOKEN" ]; then echo "No Kite token for today after 3 attempts. Last relay answer: $RESP"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "KITE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Write live quotes
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python -m hub.live

      - name: Commit live quotes
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/live.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "live quotes $(date -u +%FT%TZ)"
            git pull -q --rebase origin main
            git push -q origin main
          fi
