name: market-loop

# Every 5 minutes through the session (21 Oct 2026): working paper orders (limit, stop, trailing stop) and watchlist move
# emails. live.yml is scheduled every 5 minutes but GitHub started it only about every 30 (18 runs on Wed 21 Oct 2026);
# GitHub delays when a scheduled job starts, not a job already running, so this one stays up and calls the relay itself.
# Two runs cover 09:15-15:30 IST (a job may run 6 hours at most); they share a queue, so the second waits for the first.
on:
  schedule:
    # 26 Oct 2026: the 09:10 start began at 09:43 (GitHub delay), leaving 09:15-09:43 unchecked. It now starts at
    # 08:45 and waits for 09:15; the second is queued for 11:45 and takes over when the first stops (shared queue).
    - cron: "15 3 * * 1-5"      # 03:15 UTC = 08:45 IST: runs until 3 hours 30 minutes after it starts
    - cron: "15 6 * * 1-5"      # 06:15 UTC = 11:45 IST: waits for the first, then runs to 15:35
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 225
    steps:
      - name: Check paper orders and the watchlist every 5 minutes
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          start=$(date +%s)
          end_ist=$(TZ=Asia/Kolkata date +%Y-%m-%d)" 15:35"
          end=$(TZ=Asia/Kolkata date -d "$end_ist" +%s)
          limit=$(( start + 210 * 60 ))
          [ "$end" -lt "$limit" ] && stop=$end || stop=$limit
          n=0
          while [ "$(date +%s)" -lt "$stop" ]; do
            hm=$(TZ=Asia/Kolkata date +%H%M)
            if [ "$hm" -ge 0915 ] && [ "$hm" -le 1530 ]; then
              curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=paper_check" --data-urlencode "key=$RELAY_KEY" > /dev/null || true
              curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=watch_check" --data-urlencode "key=$RELAY_KEY" > /dev/null || true
              n=$((n + 1))
            fi
            sleep 300
          done
          echo "::notice title=market loop::$n checks between $(TZ=Asia/Kolkata date -d @$start +%H:%M) and $(TZ=Asia/Kolkata date +%H:%M) IST"
