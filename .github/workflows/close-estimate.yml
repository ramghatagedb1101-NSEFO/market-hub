name: close-estimate

# Records the phone's close estimate so it builds its own track record (26 Oct 2026, owner's go-ahead): the pre-open
# figure (GIFT Nifty at 09:10, else the S&P 500) once a day, and the live estimate with its range at each run in market
# hours. Appends to the private repo's state/close_estimate_log.json (only this job writes it); the daily job scores it.
# GitHub may start a scheduled run late; the pre-open figure is read from Kite's 09:10 candle, so lateness does not change it.
on:
  schedule:
    - cron: "50 3 * * 1-5"     # 09:20 IST
    - cron: "30 5 * * 1-5"     # 11:00 IST
    - cron: "30 7 * * 1-5"     # 13:00 IST
    - cron: "15 9 * * 1-5"     # 14:45 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: close-estimate
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch today's Kite access token from the relay (for GIFT Nifty's candles; optional)
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          for attempt in 1 2 3; do
            TOKEN=$(curl -sSL -G "$RELAY_URL" --data-urlencode "mode=token" --data-urlencode "key=$RELAY_KEY" \
              | python -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
            [ -n "$TOKEN" ] && break
            sleep $((attempt * 5))
          done
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; echo "KITE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"; else echo "No Kite token: the S&P cue is used"; fi
      - name: Record
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python -m hub.close_estimate record
