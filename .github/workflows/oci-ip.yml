name: oci-ip

# Moves the fixed address ICICI knows (130.210.31.37) from market-hub-ip to market-hub-trader (owner, 14 Nov 2026;
# infra/oci_move_ip.py). action=check only reports; action=move moves it. By hand only.
# Secrets: OCI_API_KEY, OCI_TENANCY, OCI_USER, OCI_FINGERPRINT.
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [check, move]
        default: check

permissions:
  contents: read

jobs:
  ip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "oci>=2.130"
      - env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ap-mumbai-1
        run: |
          umask 077
          printf '%s\n' "$OCI_API_KEY" > "$RUNNER_TEMP/oci.pem"
          cd infra && OCI_KEY_FILE="$RUNNER_TEMP/oci.pem" python oci_move_ip.py "${{ inputs.action }}"; rc=$?
          rm -f "$RUNNER_TEMP/oci.pem"; exit $rc
