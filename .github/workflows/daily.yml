name: daily-forecast

on:
  schedule:
    - cron: "30 12 * * 1-5"       # 12:30 UTC = 18:00 IST, weekdays (after the close, NSE bhavcopy and bulk deals)
  workflow_dispatch:              # "Run workflow" button for a manual run, free

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30                 # first run backfills 5 years of NSE bhavcopies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bring the phone app's data from the private repo
        id: pull
        continue-on-error: true   # the forecast must still run; without a pull the save step below is skipped
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data pull

      - name: Fetch today's Kite access token from the relay
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          # Diagnostics first: names, lengths and presence only. No values are printed.
          echo "RELAY_URL length ${#RELAY_URL}, ends with /exec: $(case "$RELAY_URL" in */exec) echo yes;; *) echo no;; esac)"
          echo "RELAY_KEY length ${#RELAY_KEY}"
          CHECK=$(curl -sSL -G "$RELAY_URL" -w " HTTP:%{http_code}" --data-urlencode "mode=check" --data-urlencode "key=$RELAY_KEY" || true)
          echo "Relay setup check: $CHECK"
          # Google occasionally serves a transient "Drive: Page Not Found" page for an Apps Script web
          # app call even when the script itself is fine (seen 2026-10-08: the check above succeeded
          # with a valid token a moment before the token call below hit this, with no code change in
          # between) -- retry a few times before treating it as a real missing token.
          TOKEN=""
          for attempt in 1 2 3 4; do
            RESP=$(curl -sSL -G "$RELAY_URL" -w " HTTP:%{http_code}" --data-urlencode "mode=token" --data-urlencode "key=$RELAY_KEY" || true)
            TOKEN=$(echo "$RESP" | sed 's/ HTTP:[0-9]*$//' | python -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then break; fi
            echo "Attempt $attempt: no token yet. Relay answered: $RESP"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
          if [ -z "$TOKEN" ]; then echo "No Kite token for today after 4 attempts. Last relay answer: $RESP"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "KITE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run daily job (refresh prices, settle, forecast, publish feed)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python -m hub

      - name: Nifty 50 option-selling screen (writes docs/data/stocks.json)
        continue-on-error: true
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python -m hub.stocks

      - name: F&O suggestions from the option chain
        continue-on-error: true   # a failure here must not skip bulk deals, admin publish and the commit
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python -m hub.fno

      - name: Market context (FII/DII, FX, US markets, headlines)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python -m hub.context

      - name: Daily brief (NVIDIA, Gemini fallback)
        continue-on-error: true
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m hub.narrate

      - name: Collect today's bulk deals (history for the smart-money layer)
        continue-on-error: true   # a failure here must not skip admin publish and the commit
        run: python -m hub.bulkdeals

      - name: Write the admin summary to the private repo
        continue-on-error: true
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.admin_publish

      - name: Save the phone app's data to the private repo
        if: always() && steps.pull.outcome == 'success'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data push "daily data $(date -u +%F)"

      - name: Commit state and feed
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add state rg/data/sector_map.json rg/data/index_membership.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "daily forecast $(date -u +%F)"
            # Another push may have landed during this run: rebase onto it and retry.
            # --autostash keeps any other rewritten tracked file from blocking the rebase.
            for i in 1 2 3; do
              git pull --rebase --autostash -q origin main && git push && break
              sleep 5
            done
            # Fail the step if nothing reached main, so a missed save is never reported as success.
            git fetch -q origin
            git merge-base --is-ancestor HEAD origin/main || { echo "save failed: commit did not reach main"; exit 1; }
          fi
