name: diag-one-off

# One-off diagnostic runs, triggered by pushing a change to triggers/diag.txt. Prints to the
# Actions log only -- nothing is published or committed. Safe to re-run; delete when no longer needed.
on:
  push:
    branches: [main]
    paths: ["triggers/diag.txt"]
  workflow_dispatch:
    inputs:
      no_chain:
        description: "If true, skip the self-dispatch step (prevents a loop when testing)"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Self-dispatch permission test (one hop only, no BharatStock calls)
        if: github.event.inputs.no_chain != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run diag.yml --repo "$GITHUB_REPOSITORY" -f no_chain=true \
            && echo "DISPATCH_OK" || echo "DISPATCH_FAILED"
