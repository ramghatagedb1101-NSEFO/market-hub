<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Hub · Research</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel2:#fafbfc; --line:#e5e7eb; --line2:#eef0f3;
  --text:#0f172a; --text2:#334155; --muted:#64748b; --faint:#94a3b8;
  --brand:#2563eb; --brand2:#1d4ed8; --brand-soft:#eff4ff;
  --up:#059669; --up-soft:#e7f7f0; --down:#dc2626; --down-soft:#fdecec; --warn:#b45309; --warn-soft:#fdf3e2;
  --chip:#f1f5f9; --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 1px rgba(15,23,42,.03);
  --side:#0b1220; --side-text:#cbd5e1; --side-muted:#64748b; --side-on:#1e293b;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0b1020; --panel:#111827; --panel2:#0f172a; --line:#1f2937; --line2:#172033;
    --text:#e5e7eb; --text2:#cbd5e1; --muted:#94a3b8; --faint:#64748b;
    --brand:#60a5fa; --brand2:#93c5fd; --brand-soft:#132042;
    --up:#34d399; --up-soft:#0b2a20; --down:#f87171; --down-soft:#2c1215; --warn:#fbbf24; --warn-soft:#2a210b;
    --chip:#1e293b; --shadow:none; --side:#070b16; --side-on:#152038; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---------- login ---------- */
#login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.brand svg{flex:none;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.field{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);outline:none}
.field:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.msg{min-height:20px;font-size:13px;margin-top:10px;color:var(--muted)} .msg.err{color:var(--down)}

/* ---------- shell ---------- */
#app{display:none;min-height:100%}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side .brand{color:#fff;padding:2px 8px 16px;font-size:15px}
.nav-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-muted);padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-text);font-size:13.5px;font-weight:500;text-decoration:none}
.nav a svg{width:17px;height:17px;flex:none;opacity:.85;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{background:var(--side-on);color:#fff}
.nav a.on{background:var(--side-on);color:#fff;box-shadow:inset 3px 0 0 #60a5fa}
.nav a .count{margin-left:auto;font-size:11px;color:var(--side-muted);font-family:var(--mono)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid #1e293b;font-size:12px;color:var(--side-muted)}
.side-foot button{margin-top:8px;width:100%;background:transparent;border:1px solid #1e293b;color:var(--side-text);border-radius:8px;padding:7px;cursor:pointer}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;gap:14px}
.top .crumb{font-weight:700;font-size:15px;white-space:nowrap}
.search{position:relative;margin-left:auto;width:min(420px,100%)}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,23,42,.12);overflow:hidden;display:none;z-index:20}
.suggest.on{display:block}
.suggest div{padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
.suggest div:hover,.suggest div.hi{background:var(--brand-soft)}
.suggest b{font-family:var(--mono);font-size:13px;min-width:92px}
.content{padding:24px 28px 60px;max-width:1360px;width:100%}
.menu-btn{display:none}

/* ---------- building blocks ---------- */
.h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.sub{color:var(--muted);margin:4px 0 0;font-size:13.5px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.panel-h h3{margin:0;font-size:13.5px;font-weight:700}
.panel-b{padding:14px 16px}
.kpi{padding:16px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--chip);color:var(--text2);white-space:nowrap}
.chip.up{background:var(--up-soft);color:var(--up)} .chip.down{background:var(--down-soft);color:var(--down)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.brand{background:var(--brand-soft);color:var(--brand)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .field{width:auto;min-width:150px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--brand-soft);color:var(--brand)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:12.5px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--line2),var(--line),var(--line2));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);max-height:calc(100vh - 230px)}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
table.t th{position:sticky;top:0;background:var(--panel2);text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default;z-index:1}
table.t th.sortable{cursor:pointer} table.t th.sortable:hover{color:var(--text)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
table.t td.l,table.t th.l{text-align:left}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--brand-soft)}
table.t tr:last-child td{border-bottom:0}
.co b{font-family:var(--mono);font-size:12.5px} .co span{display:block;font-size:12px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis}
.dots{display:inline-flex;gap:3px} .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--up)}
.bar{display:inline-block;width:70px;height:6px;border-radius:3px;background:var(--line);vertical-align:middle;overflow:hidden} .bar i{display:block;height:100%;background:var(--brand)}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--muted)}

/* ---------- stock report ---------- */
.rep-head{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start;margin-bottom:16px}
.rep-title{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.rep-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.price{text-align:right} .price .p{font-size:28px;font-weight:700;font-family:var(--mono)} .price .c{font-size:13px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.stats div{padding:12px 14px;border-right:1px solid var(--line2)} .stats div:last-child{border-right:0}
.stats .k{font-size:11.5px;color:var(--muted);font-weight:600} .stats .v{font-size:16px;font-weight:700;font-family:var(--mono);margin-top:2px}
.chart{position:relative;height:280px} .chart.sm{height:200px}
.lwc{position:relative;height:440px} .lwc-legend{position:absolute;left:10px;top:6px;z-index:3;font-size:12px;font-family:var(--mono);color:var(--text2);pointer-events:none;background:var(--panel);padding:2px 6px;border-radius:6px;opacity:.92}
.lwc-credit{font-size:11px;color:var(--faint);margin-top:6px} .lwc-credit a{color:var(--faint)}
.docs h4{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px} .docs h4:first-child{margin-top:0}
.docs a.doc{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line2);color:var(--text);text-decoration:none;font-size:13px} .docs a.doc:hover{color:var(--brand)}
.docs a.doc .d{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:86px}
.ai h5{font-size:15px;margin:0 0 6px} .ai ul{margin:4px 0 10px 18px;padding:0} .ai li{margin:3px 0;font-size:13px} .ai .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:10px}
.metrics{display:grid;grid-template-columns:1fr;gap:0}
.cols{columns:3 300px;column-gap:28px;padding:6px 16px 14px}
.cols>div{break-inside:avoid;display:inline-block;width:100%}
.metric{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-bottom:1px dashed var(--line2)}
.metric:last-child{border-bottom:0}
.metric .n{font-size:13px;color:var(--text2)} .metric .val{font-family:var(--mono);font-weight:700;text-align:right}
.metric .pct{grid-column:1 / -1;display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.metric .track{flex:1;height:4px;border-radius:2px;background:var(--line2);position:relative}
.metric .track i{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;margin-left:-5px;background:var(--brand);border:2px solid var(--panel)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--up) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-family:var(--mono);font-size:13px}
.timeline .ev{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line2)} .timeline .ev:last-child{border-bottom:0}
.timeline .d{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:92px}
.news a{display:block;padding:10px 0;border-bottom:1px dashed var(--line2);color:var(--text);text-decoration:none} .news a:last-child{border-bottom:0}
.news a:hover .tt{color:var(--brand)} .news .tt{font-weight:600;font-size:13.5px;line-height:1.4} .news .src{font-size:12px;color:var(--muted);margin-top:2px}
details.all summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--text2)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;cursor:pointer;margin-bottom:10px;border:0;background:none;padding:0}
.back:hover{color:var(--text)}
.rules{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 14px}
pre.raw{white-space:pre-wrap;font-size:12px;background:var(--panel2);border-radius:8px;padding:10px;margin:0;font-family:var(--mono)}

@media (max-width:1100px){ .g4{grid-template-columns:repeat(2,minmax(0,1fr))} .stats{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:inline-flex}
  .top{padding:10px 16px} .content{padding:16px 16px 48px}
  .g3,.g2{grid-template-columns:1fr} .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{width:auto;flex:1}
  .top .crumb{display:none}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="brand" style="margin-bottom:18px">
      <svg viewBox="0 0 96 96" width="34" height="34"><rect width="96" height="96" rx="20" fill="#0b1220"/><polyline points="14,64 34,44 48,54 70,28 82,36" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="36" r="5" fill="#22c55e"/></svg>
      <div>Market Hub<div class="muted" style="font-weight:500;font-size:12.5px">Research dashboard</div></div>
    </div>
    <p class="muted" style="margin:0 0 16px;font-size:13.5px">A six-digit code goes to the owner's Google account. It lasts 10 minutes; you stay signed in for seven days.</p>
    <button id="send" class="btn primary" style="width:100%" onclick="sendCode()">Email me a code</button>
    <div id="codebox" style="display:none;margin-top:14px">
      <div style="display:flex;gap:8px">
        <input id="code" class="field num" inputmode="numeric" maxlength="6" placeholder="6-digit code" onkeydown="if(event.key==='Enter')verify()">
        <button class="btn primary" onclick="verify()">Sign in</button>
      </div>
    </div>
    <div id="lmsg" class="msg"></div>
  </div>
</div>

<div id="app">
  <div class="shell">
    <aside class="side" id="side">
      <div class="brand">
        <svg viewBox="0 0 96 96" width="28" height="28"><rect width="96" height="96" rx="20" fill="#1e293b"/><polyline points="14,64 34,44 48,54 70,28 82,36" fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="82" cy="36" r="5" fill="#22c55e"/></svg>
        Market Hub
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <div id="sidefoot">Signed in</div>
        <button onclick="logout()">Sign out</button>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <button class="btn ghost menu-btn" onclick="document.getElementById('side').classList.toggle('open')" aria-label="Menu">☰</button>
        <div class="crumb" id="crumb">Overview</div>
        <div class="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" class="field" placeholder="Search a company or symbol…" autocomplete="off"
                 oninput="suggest()" onkeydown="suggestKey(event)" onblur="setTimeout(()=>hideSuggest(),150)">
          <div class="suggest" id="suggest"></div>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
// ======================================================================================
// Session (seven days on the server; the browser keeps the token in localStorage)
// ======================================================================================
const store = {
  get(){ try { return localStorage.getItem('mh_admin_token'); } catch (e) { return null; } },
  set(v){ try { localStorage.setItem('mh_admin_token', v); } catch (e) {} },
  clear(){ try { localStorage.removeItem('mh_admin_token'); } catch (e) {} }
};
let token = store.get() || '';
const $ = id => document.getElementById(id);

function call(fn, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(r => {
      if (r && r.error === 'session_expired') { logout(); reject(new Error('session expired')); return; }
      resolve(r);
    }).withFailureHandler(reject)[fn](...args);
  });
}
function lmsg(t, err){ $('lmsg').textContent = t; $('lmsg').classList.toggle('err', !!err); }
function sendCode(){
  $('send').disabled = true; lmsg('Sending…');
  google.script.run.withSuccessHandler(r => {
    if (r.error) { lmsg(r.error, true); $('send').disabled = false; return; }
    $('codebox').style.display = 'block'; $('code').focus(); lmsg('Code sent. Check your email.');
  }).withFailureHandler(e => { lmsg('Could not send the code: ' + e.message, true); $('send').disabled = false; }).adminRequestCode();
}
function verify(){
  const c = $('code').value.trim();
  if (!/^\d{6}$/.test(c)) { lmsg('Enter the six-digit code.', true); return; }
  lmsg('Checking…');
  google.script.run.withSuccessHandler(r => {
    if (!r.ok) { lmsg(r.error || 'Code not recognised.', true); return; }
    token = r.token; store.set(token); start();
  }).withFailureHandler(e => lmsg(e.message, true)).adminVerify(c);
}
function logout(){
  const t = token; store.clear(); token = '';
  google.script.run.withSuccessHandler(() => location.reload()).withFailureHandler(() => location.reload()).adminLogout(t);
}

// ======================================================================================
// Data
// ======================================================================================
const S = { admin: null, lib: null, mb: null, sl: null, watch: null, kite: null, libErr: null, mbErr: null, bySym: {}, mbBySym: {}, names: {}, dist: {}, reports: {}, charts: {}, docs: {} };

function start(){
  $('login').style.display = 'none'; $('app').style.display = 'block';
  route();
  call('adminData', token).then(d => { S.admin = d; renderFoot(); rerender(); }).catch(e => { S.admin = { error: e.message }; rerender(); });
  call('adminLibrary', token).then(unpack).then(hydrateLib).then(d => {
    if (d.error) { S.libErr = d.error; rerender(); return; }
    S.lib = d; S.names = d.names || {};
    (d.stocks || []).forEach(s => { S.bySym[s.symbol] = s; });
    if (!S.industries && d.industries && Object.keys(d.industries).length) S.industries = d.industries;
    computeFactors();
    renderNav(); rerender();
  }).catch(e => { S.libErr = e.message; rerender(); });
  loadWatch();
  call('adminKiteStatus', token).then(d => { S.kite = d; rerender(); }).catch(() => {});
  call('adminAlertSettings', token).then(d => { S.alerts = d; if (current.page === 'overview') rerender(); }).catch(() => {});
  call('adminShortlist', token).then(d => { S.sl = d; if (current.page === 'shortlist' || current.page === 'overview') rerender(); })
    .catch(e => { S.sl = { error: e.message }; rerender(); });
  call('adminIndustries', token).then(d => {
    S.industries = Object.assign({}, (S.lib && S.lib.industries) || {}, d.industries || {});
    if (current.page === 'sectors' || current.page === 'stock' || current.page === 'factors') rerender();
  }).catch(() => { S.industries = (S.lib && S.lib.industries) || {}; });
  call('adminMultibagger', token).then(unpack).then(d => {
    if (d.error) { S.mbErr = d.error; rerender(); return; }
    S.mb = d; (d.ranked || []).forEach(r => { S.mbBySym[r.symbol] = r; });
    renderNav(); rerender();
  }).catch(e => { S.mbErr = e.message; rerender(); });
}
// The relay sends the library and multi-bagger files gzipped as one base64 string (11 Oct 2026).
async function unpack(r){
  if (!r || !r.gz) return r;
  const bin = Uint8Array.from(atob(r.gz), c => c.charCodeAt(0));
  const text = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
// library_compact.json -> the shape library.json has (cells with value/status/rule, holding_history rows).
function hydrateLib(d){
  if (!d || d.format !== 'compact-1') return d;
  const pids = d.pids || [], rules = d.rules || {}, st = { Y: 'met', N: 'not_met', '.': 'not_testable' };
  const hk = ['promoter', 'public', 'fii', 'dii'];
  d.stocks = (d.stocks || []).map(x => {
    const s = Object.assign({}, x); delete s.v; delete s.s; delete s.hh;
    if (x.v) {
      s.cells = {};
      pids.forEach((k, i) => { const c = x.s[i]; if (c !== 'x') s.cells[k] = { value: x.v[i], status: st[c], rule: rules[k] }; });
    }
    if (x.hh) s.holding_history = x.hh.map(r => { const o = { quarter: r[0] }; hk.forEach((k, i) => { if (r[i + 1] != null) o[k] = r[i + 1]; }); return o; });
    return s;
  });
  return d;
}

// Cell helpers -------------------------------------------------------------------------
function cell(s, k){ return s && s.cells ? s.cells[k] : null; }
function val(s, k){ const c = cell(s, k); return c && c.value != null ? c.value : null; }
function nameOf(sym){ const n = S.names[sym]; return n ? n.replace(/\s+(Limited|Ltd\.?)$/i, '') : ''; }
function sectorOf(sym){ const s = S.bySym[sym]; return industryOf(sym) || (s && s.sector) || ''; }

// Distribution of a measure across the library (sorted), for "better than X% of companies".
function dist(k){
  if (S.dist[k]) return S.dist[k];
  const arr = [];
  (S.lib && S.lib.stocks || []).forEach(s => { const v = val(s, k); if (typeof v === 'number' && isFinite(v)) arr.push(v); });
  arr.sort((a, b) => a - b);
  return (S.dist[k] = arr);
}
function percentile(k, v){
  const a = dist(k); if (!a.length || typeof v !== 'number') return null;
  // Mid-rank for ties, so a value most companies share (often 0) sits in the middle, not at the bottom.
  const below = (() => { let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] < v) lo = m + 1; else hi = m; } return lo; })();
  const upto = (() => { let lo = below, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m] <= v) lo = m + 1; else hi = m; } return lo; })();
  return Math.round((below + (upto - below) / 2) / a.length * 100);
}

const nf = (d) => new Intl.NumberFormat('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d });
function num(v, d = 1){ return v == null || !isFinite(v) ? '–' : nf(d).format(v); }
function pct(v, d = 1, sign = true){ return v == null || !isFinite(v) ? '–' : (sign && v > 0 ? '+' : '') + nf(d).format(v) + '%'; }
function cls(v){ return v == null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : ''; }
function crore(v){ // v already in crore
  if (v == null || !isFinite(v)) return '–';
  if (Math.abs(v) >= 100000) return '₹' + nf(2).format(v / 100000) + ' L cr';
  return '₹' + nf(v >= 1000 ? 0 : 1).format(v) + ' cr';
}
function rupeesToCr(v){ return v == null ? null : v / 1e7; }

// Proven compounders: established companies with a long record. Rules tuned on the 9 Oct data
// (76 of ~1,860 companies pass all six).
// 11 Oct 2026: judged on years of annual results (hub/library.py longterm_values), plus "still delivering"
// and the ownership / size gates -- the same rules as the batch's Shortlist (hub/shortlist.py). Companies
// whose long-term figures have not arrived yet are judged on the earlier 8-quarter rules (LEGACY) until the
// next annual refresh. Operating cash flow is not comparable for banks and financials, so that rule passes
// for them.
const ge = (s, k, x) => val(s, k) != null ? val(s, k) >= x : null;
const isFinancial = s => /financial|bank/i.test(industryOf(s.symbol) || s.sector || '');
const COMPOUNDER_RULES = [
  ['Profitable in 90%+ of the last 10 years', s => ge(s, 'profitable_share_10y', 90)],
  ['Profit grew 12%+ a year over 5 years', s => ge(s, 'profit_cagr_5y', 12)],
  ['Average ROE 15%+ over 5 years', s => ge(s, 'roe_avg_5y', 15)],
  ['Operating cash 0.8×+ profit over 5 years', s => isFinancial(s) ? true : ge(s, 'cfo_to_pat_5y', 0.8)],
  ['Still delivering: profit grew in 5+ of the last 8 quarters', s => ge(s, 'profit_consistency_8q', 5)],
  ['Held by 30+ fund schemes', s => ge(s, 'mf_schemes_holding', 30)],
  ['Promoter pledge ≤ 5%', s => val(s,'pledge_pct') == null ? true : val(s,'pledge_pct') <= 5],
  ['Market cap ≥ ₹5,000 cr', s => ge(s, 'market_value_bucket', 5000)],
];
const LEGACY_COMPOUNDER_RULES = [
  ['Profit grew in 6+ of last 8 quarters', s => ge(s, 'profit_consistency_8q', 6)],
  ['Net margin ≥ 8%', s => ge(s, 'net_margin', 8)],
  ['Operating cash ≥ 0.8× profit', s => isFinancial(s) ? true : ge(s, 'cfo_to_pat', 0.8)],
  ['Held by 30+ fund schemes', s => ge(s, 'mf_schemes_holding', 30)],
  ['Promoter pledge ≤ 5%', s => val(s,'pledge_pct') == null ? true : val(s,'pledge_pct') <= 5],
  ['Market cap ≥ ₹5,000 cr', s => ge(s, 'market_value_bucket', 5000)],
];
const hasLongTerm = s => ['profitable_share_10y', 'profit_cagr_5y', 'roe_avg_5y', 'cfo_to_pat_5y'].some(k => val(s, k) != null);
const rulesFor = s => hasLongTerm(s) ? COMPOUNDER_RULES : LEGACY_COMPOUNDER_RULES;
const QUALITY_CHECKS = [
  ['Revenue growing', s => val(s,'rev_yoy') == null ? null : val(s,'rev_yoy') > 0],
  ['Interest cover ≥ 3×', s => val(s,'interest_cover') == null ? null : val(s,'interest_cover') >= 3],
  ['ROE ≥ 15%', s => val(s,'roe') == null ? null : val(s,'roe') >= 15],
  ['Above 200-day average', s => val(s,'above_200dma') == null ? null : !!val(s,'above_200dma')],
  ['Promoter stake steady (YoY)', s => val(s,'promoter_change_yoy') == null ? null : val(s,'promoter_change_yoy') >= -1],
];
function compounders(){
  if (!S.lib) return null;
  const out = [];
  S.lib.stocks.forEach(s => {
    if (!s.cells) return;
    const R = rulesFor(s);
    const res = R.map(([, f]) => f(s));
    const fails = res.filter(r => r !== true).length;
    if (fails > 1) return;
    const q = QUALITY_CHECKS.map(([, f]) => f(s));
    out.push({ s, fails, longTerm: R === COMPOUNDER_RULES, quality: q.filter(x => x === true).length, qualityTested: q.filter(x => x != null).length,
               failed: R.filter((r, i) => res[i] !== true).map(r => r[0]) });
  });
  return out;
}
function isCompounder(sym){ const s = S.bySym[sym]; return !!(s && s.cells && rulesFor(s).every(([, f]) => f(s) === true)); }

let sugg = [], suggIdx = -1;
function suggest(){
  const q = $('q').value.trim().toUpperCase();
  const box = $('suggest');
  if (!q || !S.lib) { box.classList.remove('on'); return; }
  const scored = [];
  S.lib.stocks.forEach(s => {
    const sym = s.symbol, nm = (S.names[sym] || '').toUpperCase();
    let r = -1;
    if (sym === q) r = 0; else if (sym.startsWith(q)) r = 1; else if (nm.startsWith(q)) r = 2; else if (sym.includes(q)) r = 3; else if (nm.includes(q)) r = 4;
    if (r >= 0) scored.push([r, sym]);
  });
  scored.sort((a, b) => a[0] - b[0] || (a[1] < b[1] ? -1 : 1));
  sugg = scored.slice(0, 8).map(x => x[1]); suggIdx = sugg.length ? 0 : -1;
  box.innerHTML = sugg.length ? sugg.map((sym, i) => '<div class="' + (i === suggIdx ? 'hi' : '') + '" onmousedown="pickSuggest(\'' + esc(sym) + '\')"><b>' + esc(sym) + '</b><span class="muted">' + esc(nameOf(sym)) + '</span></div>').join('')
                           : '<div class="muted" style="cursor:default">No match</div>';
  box.classList.add('on');
}
function suggestKey(e){
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!sugg.length) return; suggIdx = (suggIdx + (e.key === 'ArrowDown' ? 1 : -1) + sugg.length) % sugg.length;
    [...$('suggest').children].forEach((el, i) => el.classList.toggle('hi', i === suggIdx)); }
  else if (e.key === 'Enter' && suggIdx >= 0) { pickSuggest(sugg[suggIdx]); }
  else if (e.key === 'Escape') { hideSuggest(); }
}

// ---- Generic sortable/paged table state ----
const TS = {};   // per-page table state
function tableState(key, def){ return TS[key] || (TS[key] = Object.assign({ sort: def.sort, dir: def.dir || -1, page: 0, q: '', f: {} }, def)); }
function sortRows(rows, st, getters){
  const g = getters[st.sort]; if (!g) return rows;
  return rows.slice().sort((a, b) => { const x = g(a), y = g(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * st.dir; });
}
function th(key, label, st, align){ const on = st.sort === key; return '<th class="sortable ' + (align || '') + '" onclick="setSort(\'' + st.id + '\',\'' + key + '\')">' + label + (on ? (st.dir < 0 ? ' ↓' : ' ↑') : '') + '</th>'; }
function setSort(id, key){ const st = TS[id]; if (st.sort === key) st.dir *= -1; else { st.sort = key; st.dir = -1; } st.page = 0; rerender(); }
function setPage(id, p){ TS[id].page = p; rerender(); window.scrollTo(0, 0); }
function setQ(id, el){ TS[id].q = el.value.trim().toUpperCase(); TS[id].page = 0; const pos = el.selectionStart; rerender(); const n = $(el.id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
function setF(id, k, v){ TS[id].f[k] = v; TS[id].page = 0; rerender(); }
function pager(st, total, size){
  const pages = Math.max(1, Math.ceil(total / size)); if (st.page >= pages) st.page = pages - 1;
  const from = st.page * size;
  return { from, html: '<div class="pager"><span>' + (total ? (from + 1) + '–' + Math.min(from + size, total) + ' of ' + num(total, 0) : '0 results') + '</span>' +
    '<button class="btn" ' + (st.page === 0 ? 'disabled' : '') + ' onclick="setPage(\'' + st.id + '\',' + (st.page - 1) + ')">‹</button>' +
    '<button class="btn" ' + (st.page >= pages - 1 ? 'disabled' : '') + ' onclick="setPage(\'' + st.id + '\',' + (st.page + 1) + ')">›</button></div>' };
}
function matchQ(sym, q){ return !q || sym.includes(q) || (S.names[sym] || '').toUpperCase().includes(q); }

function slStyle(st){ return st === 'compounders' ? '<span class="chip up">Compounder</span>' : '<span class="chip brand">Emerging</span>'; }
function slSince(x){
  const p = x.since_entry;
  if (!p) return '<span class="faint">new</span>';
  return '<span class="num ' + cls(p.excess) + '">' + (p.excess > 0 ? '+' : '') + num(p.excess, 1) + ' pts</span><div class="faint" style="font-size:11px">' + pct(p.ret) + ' vs NIFTY ' + pct(p.nifty) + '</div>';
}
function slTable(rows){
  const ul = (arr, c) => arr && arr.length ? '<ul style="margin:0;padding-left:16px">' + arr.map(x => '<li class="' + (c || '') + '" style="margin:2px 0">' + esc(x) + '</li>').join('') + '</ul>' : '<span class="faint">–</span>';
  return '<div class="tbl-wrap"><table class="t"><thead><tr><th>#</th><th class="l">Company</th><th>Score</th><th>On list</th><th>Since joining</th><th>Mkt cap</th><th>P/E</th><th>1M</th><th class="l">Why it ranks here</th><th class="l">Watch</th></tr></thead><tbody>' +
    rows.map(x => '<tr class="click" onclick="openStock(\'' + esc(x.symbol) + '\')"><td class="num">' + x.rank + '</td><td class="l">' + companyCell(x.symbol) +
      (x.industry ? '<div class="faint" style="font-size:11px">' + esc(x.industry) + '</div>' : '') + '</td><td>' + scoreChip(x.score) + '</td>' +
      '<td>' + (x.core ? '<span class="chip up" title="On the list in ' + x.weeks_on + ' consecutive weekly records">Core · ' + x.weeks_on + ' wk</span>' : '<span class="chip">' + (x.weeks_on || 1) + ' wk</span>') + '</td>' +
      '<td>' + slSince(x) + '</td><td class="num">' + crore(x.mcap) + '</td><td class="num">' + (x.pe == null ? '–' : num(x.pe, 1) + '×') + '</td>' +
      '<td class="num ' + cls(x.ret_1m) + '"' + (x.ret_1m > 20 ? ' title="Stretched: up over 20% in a month"' : '') + '>' + pct(x.ret_1m) + (x.ret_1m > 20 ? ' ⚠' : '') + '</td>' +
      '<td class="l" style="white-space:normal;min-width:260px;font-size:12.5px">' + ul((x.why || []).map(w => w.replace(' - better than', ' — better than'))) + '</td>' +

}
function slRecord(tr){

  return '<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Track record</h3><span class="muted" style="font-size:12px">since ' + esc(fmtDate(tr.first_week)) + ' · ' + tr.weekly_records + ' weekly record' + (tr.weekly_records === 1 ? '' : 's') + '</span></div><div class="panel-b">' +

function pxKey(r){ return ['6M', '1Y', '3Y', '5Y'].includes(r) ? '5Y' : r; }
function loadChart(sym, r){
  const k = sym + '|' + pxKey(r);

  call('adminChart', token, sym, pxKey(r)).then(d => { S.charts[k] = d; if (current.page === 'stock' && current.arg && current.arg.toUpperCase() === sym) rerender(); })
    .catch(e => { S.charts[k] = { error: e.message }; if (current.page === 'stock') rerender(); });

function loadDocs(sym, force){
  if (S.docs[sym] && !force) return;

    .catch(e => { S.docs[sym] = { error: e.message }; if (current.page === 'stock') rerender(); });
}
function destroyCharts(){ charts.forEach(c => { try { c.destroy(); } catch (e) {} }); charts = [];
  lwcCharts.forEach(c => { try { c.remove(); } catch (e) {} }); lwcCharts = []; }

function pageStock(sym){
  destroyCharts();
  const v = $('view');

  if (!S.lib && !S.libErr) { v.innerHTML = loadingBlock('Loading the library…'); return; }

  if (!s && !r) { v.innerHTML = '<button class="back" onclick="history.back()">← Back</button>' + errBlock(sym + ' is not in the library yet.'); return; }
  const name = nameOf(sym);
  const rep = S.reports[sym];
  if (!rep) {
    S.reports[sym] = { loading: true };
    call('adminStock', token, sym, S.names[sym] || '').then(d => { S.reports[sym] = d; if (current.page === 'stock' && current.arg && current.arg.toUpperCase() === sym) rerender(); })
      .catch(e => { S.reports[sym] = { error: e.message, errors: {} }; if (current.page === 'stock') rerender(); });
  }
  const R = S.reports[sym] || { loading: true };
  loadChart(sym, '5Y');
  loadChart(sym, pxRange);
  loadDocs(sym);
  const D5 = S.charts[sym + '|5Y'] || { loading: true };
  const px = (D5.candles || []).map(c => [c[0], c[4]]);
  const last = px.length ? px[px.length - 1] : null;
  const prev = px.length > 1 ? px[px.length - 2] : null;
  const chg = last && prev ? (last[1] / prev[1] - 1) * 100 : null;

    main = chart.addAreaSeries({ lineColor: brand, topColor: brand + '33', bottomColor: brand + '05', lineWidth: 2 });
    main.setData(c.map(x => ({ time: x[0], value: x[4] })));
  }
  if (pxMA && daily && !pxRel) {
    [[ma50, warn, '50 DMA'], [ma200, faint, '200 DMA']].forEach(([m, col, title]) => {
      const pts = c.map((x, i) => ({ time: x[0], value: m[from + i] })).filter(p => p.value != null);
      if (pts.length) chart.addLineSeries({ color: col, lineWidth: 1.2, title, priceLineVisible: false, lastValueVisible: false }).setData(pts);
    });
  }
  // Overlays on the price: Bollinger bands (20 sessions, 2 standard deviations) and the 52-week range.
  if (pxBB && !pxRel) {
    const bb = bollinger(closes, 20, 2);
    [['up', 'BB upper'], ['mid', 'BB mid'], ['lo', 'BB lower']].forEach(([k, title]) => {
      const pts = c.map((x, i) => ({ time: x[0], value: bb[k][from + i] })).filter(p => p.value != null);
      if (pts.length) chart.addLineSeries({ color: brand, lineWidth: 1, lineStyle: k === 'mid' ? 2 : 0, title: k === 'mid' ? '' : title, priceLineVisible: false, lastValueVisible: false }).setData(pts);
    });
  }
  if (px52 && daily && !pxRel && all.length >= 120) {
    const yr = all.slice(-252).map(x => x[4]);
    main.createPriceLine({ price: Math.max(...yr), color: up, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '52W high' });
    main.createPriceLine({ price: Math.min(...yr), color: down, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '52W low' });
  }
  // One lower panel: volume, RSI (14, Wilder) or MACD (12, 26, 9), on its own scale under the price.
  const lower = pxRel ? 'none' : pxLower;
  let rsiV = null, macdV = null;   // for the legend
  if (lower !== 'none') chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.06, bottom: lower === 'vol' ? 0.2 : 0.3 } });
  if (lower === 'vol' && c.some(x => x[5])) {
    const vol = chart.addHistogramSeries({ priceScaleId: 'vol', priceFormat: { type: 'volume' }, priceLineVisible: false, lastValueVisible: false });
    chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
    vol.setData(c.map(x => ({ time: x[0], value: x[5] || 0, color: (x[4] >= x[1] ? up : down) + '66' })));
  }
  if (lower === 'rsi') {
    const r = rsiV = rsi(closes, 14);
    const rs = chart.addLineSeries({ priceScaleId: 'ind', color: warn, lineWidth: 1.4, title: 'RSI 14', priceLineVisible: false });
    chart.priceScale('ind').applyOptions({ scaleMargins: { top: 0.74, bottom: 0.02 } });
    rs.setData(c.map((x, i) => ({ time: x[0], value: r[from + i] })).filter(p => p.value != null));
    rs.createPriceLine({ price: 70, color: down, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '70' });
    rs.createPriceLine({ price: 30, color: up, lineWidth: 1, lineStyle: 2, axisLabelVisible: false, title: '30' });
  }
  if (lower === 'macd') {
    const m = macdV = macd(closes, 12, 26, 9);
    chart.priceScale('ind').applyOptions({ scaleMargins: { top: 0.74, bottom: 0.02 } });
    chart.addHistogramSeries({ priceScaleId: 'ind', priceLineVisible: false, lastValueVisible: false })
      .setData(c.map((x, i) => ({ time: x[0], value: m.hist[from + i], color: (m.hist[from + i] >= 0 ? up : down) + '88' })).filter(p => p.value != null));
    chart.addLineSeries({ priceScaleId: 'ind', color: brand, lineWidth: 1.3, title: 'MACD', priceLineVisible: false, lastValueVisible: false })
      .setData(c.map((x, i) => ({ time: x[0], value: m.macd[from + i] })).filter(p => p.value != null));
    chart.addLineSeries({ priceScaleId: 'ind', color: warn, lineWidth: 1.1, title: 'Signal', priceLineVisible: false, lastValueVisible: false })
      .setData(c.map((x, i) => ({ time: x[0], value: m.signal[from + i] })).filter(p => p.value != null));
  }
  if (daily) {
    // Event markers snap to the first trading day on or after the event.
    const times = c.map(x => x[0]);
    const snap = d => { const t0 = times.find(x => x >= d); return t0 || null; };
    const marks = [];
    ((s && s.actions) || []).forEach(a => {
      const subj = (a.subject || '').toLowerCase();
      const kind = /split|bonus|sub-division/.test(subj) ? 'S' : /buy ?back/.test(subj) ? 'B' : /dividend/.test(subj) ? 'D' : null;
      const tm = kind && snap(a.ex_date);
      if (tm) marks.push({ time: tm, position: 'aboveBar', color: kind === 'D' ? up : warn, shape: 'circle', text: kind });
    });
    const docs = (S.docs[sym] || {}).docs || {};
    (docs.tr || []).forEach(d => { const tm = d.date && snap(d.date); if (tm) marks.push({ time: tm, position: 'belowBar', color: brand, shape: 'arrowUp', text: 'R' }); });
    marks.sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
    if (marks.length) main.setMarkers(marks);
  }
  chart.timeScale().fitContent();
  const lg = $('lwcLegend');
  const show = x => { if (!lg || !x) return; lg.textContent = pxRel ? '' : (x[1] != null ? 'O ' + num(x[1], 2) + '  H ' + num(x[2], 2) + '  L ' + num(x[3], 2) + '  ' : '') + 'C ' + num(x[4], 2) + (x[5] ? '  Vol ' + num(x[5], 0) : '') + indText(c.indexOf(x)); };
  const indText = i => { const k = from + i;
    if (rsiV && rsiV[k] != null) return '  RSI ' + num(rsiV[k], 1);
    if (macdV && macdV.macd[k] != null && macdV.signal[k] != null) return '  MACD ' + num(macdV.macd[k], 2) + ' / ' + num(macdV.signal[k], 2);
    return ''; };
  show(c[c.length - 1]);
  const byTime = {}; c.forEach(x => { byTime[x[0]] = x; });
  chart.subscribeCrosshairMove(p => { show(p && p.time != null && byTime[typeof p.time === 'object' ? p.time.year + '-' + String(p.time.month).padStart(2, '0') + '-' + String(p.time.day).padStart(2, '0') : p.time] || c[c.length - 1]); });

// ======================================================================================
// Analytics (9 Oct 2026): factor scores, screener, scatter explorer, what changed, sectors, peers
// ======================================================================================
// Factor scores: each input's percentile among all companies (flipped where lower is better), averaged.
// A factor needs at least half its inputs (and two) to be scored; the composite needs four of the five,
// so a company missing whole factors (common for the smallest) cannot float to the top on partial data.
const FACTORS = [
  ['quality', 'Quality', [['roe', 1], ['roce', 1], ['net_margin', 1], ['operating_margin', 1], ['cfo_to_pat', 1], ['interest_cover', 1], ['debt_to_equity', -1], ['profit_consistency_8q', 1],
                          ['roe_avg_5y', 1], ['roe_min_5y', 1], ['profitable_share_10y', 1], ['cfo_to_pat_5y', 1]], 8],
  ['growth', 'Growth', [['rev_yoy', 1], ['profit_yoy', 1], ['eps_yoy', 1], ['profit_run', 1], ['cfo_growth', 1], ['rev_cagr_5y', 1], ['profit_cagr_5y', 1], ['eps_cagr_5y', 1]], 5],
  ['value', 'Value', [['pe', -1], ['pb', -1], ['ps', -1], ['dividend_yield', 1]]],
  ['momentum', 'Momentum', [['ret_3m', 1], ['ret_12m', 1], ['rel_strength_vs_index', 1], ['from_52w_high', 1]]],
  ['ownership', 'Ownership', [['promoter_change_yoy', 1], ['fii_change_qoq', 1], ['dii_change_qoq', 1], ['mf_schemes_added', 1], ['pledge_pct', -1]]]
];
// Valuation multiples at or below zero mean losses or negative book: not "cheap", so not scored.
const POSITIVE_ONLY = { pe: 1, pb: 1, ps: 1 };
function scoreInput(s, k, dir){
  let v = val(s, k);
  if (typeof v !== 'number' || !isFinite(v)) return null;
  if (k === 'fii_change_qoq' && !fiiOk(s)) return null;
  if (POSITIVE_ONLY[k] && v <= 0) return null;
  const p = percentileOf(k, v);
  return p == null ? null : (dir > 0 ? p : 100 - p);
}
// Percentile over the positive-only distribution for valuation multiples.
function percentileOf(k, v){
  if (!POSITIVE_ONLY[k]) return percentile(k, v);
  const key = k + '__pos';
  if (!S.dist[key]) S.dist[key] = dist(k).filter(x => x > 0);
  const a = S.dist[key]; if (!a.length) return null;
  let below = 0, upto = 0; for (const x of a) { if (x < v) below++; if (x <= v) upto++; }
  return Math.round((below + (upto - below) / 2) / a.length * 100);
}
function computeFactors(){
  S.fac = {};
  if (!S.lib) return;
  S.lib.stocks.forEach(s => {
    if (!s.cells) return;
    const f = {};
    FACTORS.forEach(([key, , inputs, base]) => {
      const xs = inputs.map(([k, d]) => scoreInput(s, k, d)).filter(x => x != null);
      // base: inputs before the long-term ones (11 Oct 2026) -- they add evidence, never raise the bar.
      f[key] = xs.length >= Math.max(2, Math.ceil((base || inputs.length) / 2)) ? Math.round(xs.reduce((a, b) => a + b, 0) / xs.length) : null;
    });
    const got = FACTORS.map(([k]) => f[k]).filter(x => x != null);
    f.composite = got.length >= 4 ? Math.round(got.reduce((a, b) => a + b, 0) / got.length) : null;
    S.fac[s.symbol] = f;
  });
}
function fac(sym, k){ return S.fac && S.fac[sym] ? S.fac[sym][k] : null; }
function scoreChip(v){
  if (v == null) return '<span class="faint">–</span>';
  const c = v >= 70 ? 'up' : v >= 40 ? '' : 'down';
  return '<span class="chip ' + c + ' num" style="min-width:38px;justify-content:center">' + v + '</span>';
}
function industryOf(sym){ return (S.industries && S.industries[sym]) || (S.lib && S.lib.industries && S.lib.industries[sym]) || ''; }

// Fields available to the screener and the scatter explorer.
function fieldList(){
  const f = [['composite', 'Composite score', 'score'], ...FACTORS.map(([k, l]) => [k, l + ' score', 'score'])];
  Object.keys(M).forEach(k => { if (!['bool'].includes(M[k][2])) f.push([k, M[k][0], M[k][2]]); });
  f.push(['mb_score', 'Multibagger gates (0–4)', 'int']);
  return f;
}
function fieldVal(sym, k){
  if (k === 'composite' || FACTORS.some(x => x[0] === k)) return fac(sym, k);
  if (k === 'mb_score') { const r = S.mbBySym[sym]; return r && r.score != null ? r.score : null; }
  if (k === 'fii_change_qoq' && !fiiOk(S.bySym[sym])) return null;
  const v = val(S.bySym[sym], k);
  return typeof v === 'number' ? v : (typeof v === 'boolean' ? (v ? 1 : 0) : null);
}
function fieldLabel(k){ const f = fieldList().find(x => x[0] === k); return f ? f[1] : k; }
function fieldFmt(k, v){
  if (v == null) return '–';
  if (k === 'composite' || FACTORS.some(x => x[0] === k)) return String(v);
  if (k === 'mb_score') return v + '/4';
  return fmtMeasure(k, v);
}

function pageFactors(){
  const v = $('view');
  if (S.libErr) { v.innerHTML = errBlock(S.libErr); return; }

  const st = tableState('fac', { id: 'fac', sort: 'composite', dir: -1, f: { ind: '', minmc: 1000 } });
  let rows = S.lib.stocks.filter(s => s.cells && fac(s.symbol, 'composite') != null && matchQ(s.symbol, st.q) &&
    (!st.f.ind || industryOf(s.symbol) === st.f.ind) && (val(s, 'market_value_bucket') || 0) >= (st.f.minmc || 0));
  const G = { mcap: s => val(s, 'market_value_bucket') };
  ['composite', ...FACTORS.map(f => f[0])].forEach(k => { G[k] = s => fac(s.symbol, k); });
  rows = sortRows(rows, st, G);
  const pg = pager(st, rows.length, 50);
  const inds = [...new Set(Object.values(S.industries || {}))].sort();
  const body = rows.slice(pg.from, pg.from + 50).map((s, i) => '<tr class="click" onclick="openStock(\'' + esc(s.symbol) + '\')"><td class="l num faint">' + (pg.from + i + 1) + '</td><td class="l">' + companyCell(s.symbol) + '</td>' +

    '<div class="metric" style="grid-template-columns:1fr auto"><span class="n">Correlation</span><span class="val">' + (corr == null ? '–' : num(corr, 2)) + '</span></div>' +
    '<div class="faint" style="font-size:12px;margin:2px 0 12px">' + (corr == null ? '' : Math.abs(corr) < 0.1 ? 'No real relationship.' : Math.abs(corr) < 0.3 ? 'Weak relationship.' : Math.abs(corr) < 0.6 ? 'Moderate relationship.' : 'Strong relationship.') + '</div>' +
    '<div style="font-weight:600;font-size:13px;margin-bottom:4px">Sweet spot (' + corner.length + ')</div><div class="faint" style="font-size:12px;margin-bottom:6px">Better than the median on both, by composite score</div>' +
    corner.slice(0, 10).map(p => '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line2)"><a href="javascript:void 0" onclick="openStock(\'' + esc(p.sym) + '\')" class="num">' + esc(p.sym) + '</a>' + scoreChip(fac(p.sym, 'composite')) + '</div>').join('');
}
function dirOf(k){ if (k === 'composite' || FACTORS.some(f => f[0] === k) || k === 'mb_score') return 1; return (M[k] || [])[3] || 1; }

// ---------------- What changed ----------------
function pageSignals(){
  const v = $('view');
  if (S.libErr) { v.innerHTML = errBlock(S.libErr); return; }
  if (!S.lib) { v.innerHTML = loadingBlock('Loading the library…'); return; }
  const st = tableState('sig', { id: 'sig', f: { kind: '' } });
  const ev = [];
  const add = (sym, kind, text, tone, when, weight) => ev.push({ sym, kind, text, tone, when, weight: weight || 0 });
  S.lib.stocks.forEach(s => {
    if (!s.cells) return; const sym = s.symbol;
    // Since this company's previous scoring
    if (s.prev && s.prev.values) {
      const pv = s.prev.values, fake = { cells: Object.fromEntries(Object.keys(pv).map(k => [k, { value: pv[k] }])) };
      const was = COMPOUNDER_RULES.every(([, f]) => f(fake) === true), is = isCompounder(sym);
      if (is && !was) add(sym, 'screen', 'Entered Proven compounders', 'up', s.scored_on, 9);
      if (was && !is) add(sym, 'screen', 'Left Proven compounders', 'down', s.scored_on, 8);
      const mbNow = (S.mbBySym[sym] || {}).score;
      if (s.prev.mb_score != null && mbNow != null && mbNow !== s.prev.mb_score) add(sym, 'screen', 'Multibagger gates ' + s.prev.mb_score + ' → ' + mbNow, mbNow > s.prev.mb_score ? 'up' : 'down', s.scored_on, 6 + Math.abs(mbNow - s.prev.mb_score));
      [['promoter_holding', 'Promoter'], ['fii_holding', 'FII'], ['dii_holding', 'DII']].forEach(([k, l]) => {
        if (k === 'fii_holding' && !(fiiOk(s) && s.prev.shp_v >= 2)) return;   // old and new FII methods are not comparable
        const a = pv[k], b = val(s, k); if (a != null && b != null && Math.abs(b - a) >= 1) add(sym, 'ownership', l + ' ' + num(b, 2) + '%, ' + (b > a ? 'up ' : 'down ') + num(Math.abs(b - a), 2) + ' from ' + num(a, 2) + '% at the previous scoring', b > a ? 'up' : 'down', s.scored_on, Math.abs(b - a));
      });
      const pa = pv.profit_yoy, pb = val(s, 'profit_yoy');
      if (pa != null && pb != null && Math.sign(pa) !== Math.sign(pb) && Math.abs(pb) > 5) add(sym, 'results', 'Profit growth turned ' + (pb > 0 ? 'positive' : 'negative') + ' (' + pct(pa) + ' → ' + pct(pb) + ')', pb > 0 ? 'up' : 'down', s.scored_on, 5);
      if (s.prev.met != null && s.met != null && Math.abs(s.met - s.prev.met) >= 5) add(sym, 'results', 'Rules met ' + s.prev.met + ' → ' + s.met, s.met > s.prev.met ? 'up' : 'down', s.scored_on, Math.abs(s.met - s.prev.met) / 2);
    }
    // From the latest quarterly filing (available now) -- only if that filing is recent, so old news stays out.
    const fresh = s.latest_period && (Date.now() - new Date(s.latest_period)) / 86400000 <= 210;
    if (fresh) [['promoter_change_qoq', 'Promoter'], ['fii_change_qoq', 'FII'], ['dii_change_qoq', 'DII']].forEach(([k, l]) => {
      if (k === 'fii_change_qoq' && !fiiOk(s)) return;
      const c = val(s, k), lvl = val(s, k.replace('_change_qoq', '_holding'));
      if (c != null && lvl != null && Math.abs(c) >= 2) add(sym, 'ownership', l + ' ' + num(lvl, 2) + '%, ' + (c > 0 ? 'up ' : 'down ') + num(Math.abs(c), 2) + ' from ' + num(lvl - c, 2) + '% last quarter', c > 0 ? 'up' : 'down', s.latest_period, Math.abs(c));
    });
    const pl = val(s, 'pledge_pct'), plc = val(s, 'pledge_change');
    if (pl != null && pl >= 10 && plc != null && plc > 0) add(sym, 'ownership', 'Promoter pledge high and rising: ' + num(pl, 1) + '% of their shares', 'down', s.latest_period, 4);
    (s.actions || []).forEach(a => { if (a.upcoming) add(sym, 'action', a.subject + ' — ex-date ' + fmtDate(a.ex_date), 'brand', a.ex_date, 3); });
  });
  const kinds = [['', 'All'], ['screen', 'Screens'], ['ownership', 'Ownership'], ['results', 'Results'], ['action', 'Corporate actions']];
  const list = ev.filter(e => (!st.f.kind || e.kind === st.f.kind) && matchQ(e.sym, st.q)).sort((a, b) => (b.weight - a.weight) || String(b.when || '').localeCompare(String(a.when || '')));
  const withPrev = S.lib.stocks.filter(s => s.prev).length;
  const pg = pager(st, list.length, 60);
  const icon = { screen: '◆', ownership: '◐', results: '▲', action: '◷' };
  v.innerHTML = '<div class="page-head"><div><h1 class="h1">What changed</h1><p class="sub">Changes since each company was last scored (screens entered or left, gates, big ownership moves, results turning), plus notable moves in the latest quarterly filings and upcoming corporate actions. Strongest first.</p></div></div>' +
    (withPrev < 50 ? '<div class="notice" style="margin-bottom:12px">Change tracking started on 9 Oct 2026: ' + withPrev + ' companies have a previous scoring to compare with so far. It fills in as the weekly batch re-scores each company. Filing-based moves and corporate actions below are already complete.</div>' : '') +
    '<div class="toolbar"><input id="sigq" class="field" placeholder="Filter by name or symbol" value="' + esc(st.q) + '" oninput="setQ(\'sig\',this)"><div class="seg">' +
    kinds.map(([k, l]) => '<button class="' + ((st.f.kind || '') === k ? 'on' : '') + '" onclick="setF(\'sig\',\'kind\',\'' + k + '\')">' + l + ' <span class="faint">' + (k ? ev.filter(e => e.kind === k).length : ev.length) + '</span></button>').join('') + '</div></div>' +
    '<div class="tbl-wrap"><table class="t"><thead><tr><th class="l">Company</th><th class="l">What happened</th><th class="l">Type</th><th>As of</th><th>Composite</th></tr></thead><tbody>' +
    (list.slice(pg.from, pg.from + 60).map(e => '<tr class="click" onclick="openStock(\'' + esc(e.sym) + '\')"><td class="l">' + companyCell(e.sym) + '</td><td class="l" style="white-space:normal"><span class="' + (e.tone === 'up' ? 'up' : e.tone === 'down' ? 'down' : '') + '">' + esc(e.text) + '</span></td>' +
      '<td class="l"><span class="chip">' + icon[e.kind] + ' ' + esc((kinds.find(k => k[0] === e.kind) || ['', e.kind])[1]) + '</span></td><td class="num muted">' + esc(fmtDate(e.when)) + '</td><td>' + scoreChip(fac(e.sym, 'composite')) + '</td></tr>').join('') ||
      '<tr><td colspan="5" class="empty">Nothing to show for this filter.</td></tr>') + '</tbody></table></div>' + pg.html;
}

// ---------------- Sectors ----------------
const SEC = { sel: '', sort: 'composite', dir: -1 };
function median(xs){ const a = xs.filter(x => x != null && isFinite(x)).sort((p, q) => p - q); return a.length ? a[Math.floor(a.length / 2)] : null; }
function sectorStats(){
  const by = {};
  S.lib.stocks.forEach(s => { if (!s.cells) return; const ind = industryOf(s.symbol); if (!ind) return; (by[ind] = by[ind] || []).push(s); });
  return Object.keys(by).map(ind => { const ss = by[ind];
    return { ind, n: ss.length, mcap: ss.reduce((a, s) => a + (val(s, 'market_value_bucket') || 0), 0),
      rev: median(ss.map(s => val(s, 'rev_yoy'))), profit: median(ss.map(s => val(s, 'profit_yoy'))), margin: median(ss.map(s => val(s, 'net_margin'))),
      roe: median(ss.map(s => val(s, 'roe'))), pe: median(ss.map(s => { const x = val(s, 'pe'); return x > 0 ? x : null; })), r12: median(ss.map(s => val(s, 'ret_12m'))),
      composite: median(ss.map(s => fac(s.symbol, 'composite'))), comp: ss.filter(s => isCompounder(s.symbol)).length,
      mb: ss.filter(s => ((S.mbBySym[s.symbol] || {}).score || 0) >= 3).length, stocks: ss }; });
}
function secSort(k){ if (SEC.sort === k) SEC.dir *= -1; else { SEC.sort = k; SEC.dir = -1; } rerender(); }
function secPick(ind){ SEC.sel = SEC.sel === ind ? '' : ind; rerender(); }
function heat(v, all, better){
  if (v == null) return '';
  const xs = all.filter(x => x != null).sort((a, b) => a - b); if (xs.length < 3) return '';
  let r = xs.filter(x => x < v).length / (xs.length - 1); if (better < 0) r = 1 - r;
  const c = r >= 0.5 ? cssVar('--up') : cssVar('--down'); const a = Math.round(Math.abs(r - 0.5) * 2 * 38);
  return 'background:' + c + (a < 16 ? '0' : '') + a.toString(16) + ';';
}
function pageSectors(){
  const v = $('view');
  if (S.libErr) { v.innerHTML = errBlock(S.libErr); return; }
  if (!S.lib) { v.innerHTML = loadingBlock('Loading the library…'); return; }
  if (!S.industries) { v.innerHTML = loadingBlock('Loading NSE industry classifications…'); return; }
  destroyCharts();
  const rows = sectorStats();
  // Industries with fewer than 5 companies are too small for medians to mean much: ranked last, faded, kept out of the chart.
  const SMALL = 5;
  const g = r => r[SEC.sort]; rows.sort((a, b) => { if ((a.n < SMALL) !== (b.n < SMALL)) return a.n < SMALL ? 1 : -1;
    const x = g(a), y = g(b); if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * SEC.dir; });
  const cols = [['n', 'Companies', 0, v => num(v, 0)], ['mcap', 'Total mkt cap', 0, v => crore(v)], ['rev', 'Revenue gr.', 1, v => pct(v)], ['profit', 'Profit gr.', 1, v => pct(v)], ['margin', 'Net margin', 1, v => v == null ? '–' : num(v, 1) + '%'],
                ['roe', 'ROE', 1, v => v == null ? '–' : num(v, 1) + '%'], ['pe', 'P/E', -1, v => v == null ? '–' : num(v, 1) + '×'], ['r12', '12M return', 1, v => pct(v)], ['composite', 'Composite', 1, v => v == null ? '–' : String(v)], ['comp', 'Compounders', 0, v => v || '–'], ['mb', 'Multibaggers 3+', 0, v => v || '–']];
  const covered = rows.reduce((a, r) => a + r.n, 0);
  let html = '<div class="page-head"><div><h1 class="h1">Sectors</h1><p class="sub">Medians by NSE industry for the ' + num(covered, 0) + ' companies in the NIFTY Total Market index (NSE classifies these; smaller companies are not covered). Green/red shading compares industries with each other; industries with fewer than 5 companies are faded and left out of the chart. Click an industry for its companies.</p></div></div>' +
    '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Median 12-month return by industry</h3></div><div class="panel-b"><div style="position:relative;height:' + Math.max(260, rows.length * 22 + 40) + 'px"><canvas id="cSec"></canvas></div></div></div>' +
    '<div class="tbl-wrap" style="max-height:none;margin-bottom:14px"><table class="t"><thead><tr><th class="l sortable" onclick="secSort(\'ind\')">Industry</th>' + cols.map(([k, l]) => '<th class="sortable" onclick="secSort(\'' + k + '\')">' + l + (SEC.sort === k ? (SEC.dir < 0 ? ' ↓' : ' ↑') : '') + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr class="click"' + (r.n < SMALL ? ' title="Fewer than ' + SMALL + ' companies: medians are not reliable" style="opacity:.55"' : '') + ' onclick="secPick(\'' + esc(r.ind).replace(/'/g, '\\\'') + '\')"' + (SEC.sel === r.ind ? ' style="outline:2px solid var(--brand);outline-offset:-2px"' : '') + '><td class="l"><b>' + esc(r.ind) + '</b></td>' +
      cols.map(([k, , better, f]) => '<td class="num" style="' + (better && r.n >= SMALL ? heat(r[k], rows.filter(x => x.n >= SMALL).map(x => x[k]), better) : '') + '">' + f(r[k]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  const sel = rows.find(r => r.ind === SEC.sel);
  if (sel) {
    const ss = sel.stocks.slice().sort((a, b) => (fac(b.symbol, 'composite') || -1) - (fac(a.symbol, 'composite') || -1));
    html += '<div class="panel"><div class="panel-h"><h3>' + esc(sel.ind) + ' — ' + sel.n + ' companies, best composite score first</h3><a href="javascript:void 0" onclick="secPick(\'\')">Close</a></div><table class="t"><tr><th class="l">Company</th><th>Mkt cap</th><th>P/E</th><th>Revenue gr.</th><th>Profit gr.</th><th>Net margin</th><th>12M</th><th>Composite</th></tr>' +
      ss.map(s => '<tr class="click" onclick="openStock(\'' + esc(s.symbol) + '\')"><td class="l">' + companyCell(s.symbol) + '</td><td class="num">' + crore(val(s, 'market_value_bucket')) + '</td><td class="num">' + (val(s, 'pe') > 0 ? num(val(s, 'pe'), 1) + '×' : '–') + '</td><td class="num ' + cls(val(s, 'rev_yoy')) + '">' + pct(val(s, 'rev_yoy')) + '</td><td class="num ' + cls(val(s, 'profit_yoy')) + '">' + pct(val(s, 'profit_yoy')) + '</td><td class="num">' + (val(s, 'net_margin') == null ? '–' : num(val(s, 'net_margin'), 1) + '%') + '</td><td class="num ' + cls(val(s, 'ret_12m')) + '">' + pct(val(s, 'ret_12m')) + '</td><td>' + scoreChip(fac(s.symbol, 'composite')) + '</td></tr>').join('') + '</table></div>';
  }
  v.innerHTML = html;
  const el = $('cSec');
  if (el && typeof Chart !== 'undefined') {
    const rr = rows.filter(r => r.r12 != null && r.n >= SMALL).sort((a, b) => b.r12 - a.r12);
    const up = cssVar('--up'), down = cssVar('--down'), tick = cssVar('--muted'), grid = cssVar('--line2');
    charts.push(new Chart(el, { type: 'bar', data: { labels: rr.map(r => r.ind), datasets: [{ data: rr.map(r => Math.round(r.r12 * 10) / 10), backgroundColor: rr.map(r => r.r12 >= 0 ? up : down), borderRadius: 3, barThickness: 14 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, onClick: (e, els) => { if (els.length) secPick(rr[els[0].index].ind); },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => 'Median 12M return ' + pct(c.parsed.x) + ' · ' + rr[c.dataIndex].n + ' companies' } } },
        scales: { x: { grid: { color: grid }, ticks: { color: tick, callback: v => v + '%' } }, y: { grid: { display: false }, ticks: { color: tick, font: { size: 11.5 } } } } } }));
  }
}

// ---------------- Stock report additions: factor profile and peers ----------------
function peersOf(sym){
  const ind = industryOf(sym), me = S.bySym[sym], mc = val(me, 'market_value_bucket');
  if (!me || !me.cells || !mc) return { basis: null, list: [] };
  const pool = S.lib.stocks.filter(s => s.cells && s.symbol !== sym && val(s, 'market_value_bucket') > 0 && (ind ? industryOf(s.symbol) === ind : !industryOf(s.symbol)));
  pool.sort((a, b) => Math.abs(Math.log(val(a, 'market_value_bucket') / mc)) - Math.abs(Math.log(val(b, 'market_value_bucket') / mc)));
  return { basis: ind ? 'same industry (' + ind + '), closest in size' : 'unclassified companies closest in size (no NSE industry for this company)', list: pool.slice(0, 6) };
}
function factorPanel(sym){
  const f = S.fac && S.fac[sym];
  if (!f || f.composite == null) return '';
  const ind = industryOf(sym);
  return '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Factor profile</h3><span class="muted" style="font-size:12px">0–100 vs all companies' + (ind ? ' · dashed = ' + esc(ind) + ' median' : '') + '</span></div>' +
    '<div class="grid g2" style="gap:0"><div class="panel-b" style="border-right:1px solid var(--line2)"><div class="chart sm" style="height:240px"><canvas id="cRadar"></canvas></div></div>' +
    '<div class="panel-b">' + [['composite', 'Composite']].concat(FACTORS.map(x => [x[0], x[1]])).map(([k, l]) => '<div class="metric" style="grid-template-columns:1fr auto"><span class="n"' + (k === 'composite' ? ' style="font-weight:700;color:var(--text)"' : '') + '>' + l + '</span><span>' + scoreChip(f[k]) + '</span>' +
      (k !== 'composite' && f[k] != null ? '<span class="pct"><span class="track"><i style="left:' + f[k] + '%"></i></span><span style="min-width:116px;text-align:right">' + (f[k] >= 70 ? 'strong' : f[k] >= 40 ? 'middling' : 'weak') + '</span></span>' : '') + '</div>').join('') + '</div></div></div>';
}
function peersPanel(sym){
  if (!S.lib) return '';
  const p = peersOf(sym);
  if (!p.list.length) return '';
  const rows = [S.bySym[sym], ...p.list];
  const cols = [['market_value_bucket', 'Mkt cap'], ['pe', 'P/E'], ['rev_yoy', 'Revenue gr.'], ['profit_yoy', 'Profit gr.'], ['net_margin', 'Net margin'], ['roe', 'ROE'], ['ret_12m', '12M']];
  const best = {}; cols.forEach(([k]) => { const d = dirOf(k); const xs = rows.map(s => val(s, k)).filter(x => x != null && (k !== 'pe' || x > 0)); if (xs.length > 1 && k !== 'market_value_bucket') best[k] = d < 0 ? Math.min(...xs) : Math.max(...xs); });
  return '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Peers</h3><span class="muted" style="font-size:12px">' + esc(p.basis) + ' · bold = best in group</span></div><div class="tbl-wrap" style="border:0;box-shadow:none;border-radius:0;max-height:none"><table class="t"><tr><th class="l">Company</th>' + cols.map(([, l]) => '<th>' + l + '</th>').join('') + '<th>Composite</th></tr>' +
    rows.map((s, i) => '<tr class="' + (i ? 'click' : '') + '"' + (i ? ' onclick="openStock(\'' + esc(s.symbol) + '\')"' : ' style="background:var(--brand-soft)"') + '><td class="l">' + companyCell(s.symbol) + '</td>' +
      cols.map(([k]) => { const x = val(s, k); return '<td class="num' + (best[k] != null && x === best[k] ? '" style="font-weight:800' : '') + '">' + (k === 'pe' && !(x > 0) ? '–' : fmtMeasure(k, x)) + '</td>'; }).join('') + '<td>' + scoreChip(fac(s.symbol, 'composite')) + '</td></tr>').join('') + '</table></div></div>';
}
function drawRadar(sym){
  const el = $('cRadar'); const f = S.fac && S.fac[sym];
  if (!el || !f || typeof Chart === 'undefined') return;
  const ind = industryOf(sym);
  const labels = FACTORS.map(x => x[1]);
  const me = FACTORS.map(([k]) => f[k]);
  const ds = [{ label: sym, data: me, borderColor: cssVar('--brand'), backgroundColor: cssVar('--brand') + '33', borderWidth: 2, pointRadius: 3 }];
  if (ind) {
    const peers = S.lib.stocks.filter(s => s.cells && industryOf(s.symbol) === ind);
    ds.push({ label: ind + ' median', data: FACTORS.map(([k]) => median(peers.map(s => fac(s.symbol, k)))), borderColor: cssVar('--faint'), borderDash: [4, 3], backgroundColor: 'transparent', borderWidth: 1.5, pointRadius: 0 });
  }
  charts.push(new Chart(el, { type: 'radar', data: { labels, datasets: ds },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: { r: { min: 0, max: 100, ticks: { stepSize: 25, display: false }, grid: { color: cssVar('--line') }, angleLines: { color: cssVar('--line') }, pointLabels: { color: cssVar('--text2'), font: { size: 11.5 } } } } } }));
}

// ======================================================================================
if (token) start(); else { $('login').style.display = 'flex'; }
</script>
