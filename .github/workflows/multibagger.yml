name: multibagger-weekly

# 2026-10-08: superseded by the stock-library-weekly job (.github/workflows/library.yml), which now
# computes the same multi-bagger gate score in its own per-company loop, from the same BharatStock
# rows it already fetches for the 124-parameter screen -- this used to independently re-fetch the
# same financials for the same ~2,570 companies a day later every week. Schedule removed; kept as a
# manual escape hatch (push to triggers/multibagger.txt, or "Run workflow") for a one-off full
# recompute, e.g. to cross-check consistency while debugging.
on:
  push:
    branches: [main]
    paths: ["triggers/multibagger.txt"]   # push a change to this file to start a run
  workflow_dispatch:              # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: multibagger
  cancel-in-progress: false

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Multi-bagger screen (BharatStock financials; derived ratings only)
        env:
          BHARATSTOCK_API_KEY: ${{ secrets.BHARATSTOCK_API_KEY }}
        run: python -m hub.multibagger

      - name: Commit multi-bagger
        if: always()          # save whatever was rated, even if the screen step failed or timed out
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/multibagger.json
          if git diff --cached --quiet; then
            echo "No multi-bagger changes to commit"
          else
            git commit -m "multi-bagger $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -q origin main && git push && break
              sleep 5
            done
            git fetch -q origin
            git merge-base --is-ancestor HEAD origin/main || { echo "save failed: multi-bagger commit did not reach main"; exit 1; }
          fi
