name: stock-library-weekly

# Scores every listed NSE equity on the registry parameters with a confirmed source, writing the
# full result to the private repo market-hub-private (never the public site, since it holds
# BharatStock-derived figures). Each company's multi-bagger gate score is computed in the same loop,
# from the same already-fetched BharatStock rows, and published (derived scores/gates only, same as
# before) to the public site's docs/data/multibagger.json -- this replaced a second, independent
# weekly fetch of the same financials that multibagger-weekly used to run on Sundays.
on:
  push:
    branches: [main]
    paths: ["triggers/library.txt"]   # push a change to this file to start a run
  schedule:
    - cron: "30 1 * * 6"            # 01:30 UTC on Saturdays = 07:00 IST, Saturday morning
    - cron: "5 0 8 10 *"            # one-time: 00:05 UTC = 5:35 IST on 2026-10-08, first clean run after the
                                     # BharatStock daily quota (resets 00:00 UTC) was exhausted during 2026-10-07
                                     # testing. Harmless if it also fires on 8 Oct in future years; remove this
                                     # line after 2026-10-08 if you don't want that.
  workflow_dispatch:

permissions:
  contents: write   # needed to commit docs/data/multibagger.json to this (public) repo
  actions: write    # lets the last step chain to the next batch (see below)

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # One run cannot score all ~2,570 companies once real API calls are happening (roughly 300
      # fit in the 70-minute internal time budget). hub/library.py resumes from the cursor stored
      # in the last published library.json and reports whether this batch reached the end of the
      # universe (cycle_complete). While it hasn't, the next step re-dispatches this same workflow
      # so a full pass finishes on its own across several runs, instead of waiting a week between
      # Saturday cron fires.
      - name: Score the stock library (one batch)
        id: score
        env:
          BHARATSTOCK_API_KEY: ${{ secrets.BHARATSTOCK_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL }}     # same relay the daily job uses; mode=alert emails a new discovery-tier finding
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          set -o pipefail
          python -m hub.library | tee /tmp/library_result.json
          python -c "import json; print('cycle_complete=' + str(json.load(open('/tmp/library_result.json')).get('cycle_complete', False)))" >> "$GITHUB_OUTPUT"
      - name: Commit multi-bagger
        if: always()          # save whatever was rated, even if the library step above failed or timed out
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/multibagger.json
          if git diff --cached --quiet; then
            echo "No multi-bagger changes to commit"
          else
            git commit -m "multi-bagger (via library batch) $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -q origin main && git push && break
              sleep 5
            done
            git fetch -q origin
            git merge-base --is-ancestor HEAD origin/main || { echo "save failed: multi-bagger commit did not reach main"; exit 1; }
          fi
      - name: Continue to the next batch
        if: steps.score.outputs.cycle_complete != 'True'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run library.yml --repo "$GITHUB_REPOSITORY"
