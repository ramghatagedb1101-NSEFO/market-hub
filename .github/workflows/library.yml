name: stock-library-weekly

# Since 10 Oct 2026 this runs DAILY and fetches only what changed (hub/library.py, "What each company
# needs"): prices come from NSE's free daily file, and BharatStock is asked only for companies that
# have filed new results, within a daily budget (BS_DAILY_BUDGET, 9,000 of the 10,000 allowed). A
# normal day costs a few hundred BharatStock requests at most. The name is kept so existing links work.

# Scores every listed NSE equity on the registry parameters with a confirmed source, writing the
# full result to the private repo market-hub-private (never the public site, since it holds
# BharatStock-derived figures). Each company's multi-bagger gate score is computed in the same loop,
# from the same already-fetched BharatStock rows, and published (derived scores/gates only, same as
# before) as multibagger.json in the private repo's site/ folder, which the signed-in phone app
# reads through the relay (hub/site_data.py) -- this replaced a second, independent
# weekly fetch of the same financials that multibagger-weekly used to run on Sundays.
on:
  push:
    branches: [main]
    paths: ["triggers/library.txt"]   # push a change to this file to start a run
  schedule:
    - cron: "45 0 * * *"            # 00:45 UTC = 06:15 IST daily: after BharatStock's allowance resets (00:00 UTC)
                                     # and after NSE has published the previous day's price file and filings
  workflow_dispatch:

permissions:
  contents: read
  actions: write    # lets the last step chain to the next batch (see below)

concurrency:
  group: library
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      # NSE's daily price files (hub/bhav.py), kept between runs so each run downloads only new days.
      # A fresh key every run (caches are immutable); restore takes the newest one.
      - name: Restore the daily price files
        uses: actions/cache/restore@v4
        with:
          path: .cache/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-
      - name: Bring the private data (site/, state/) from the private repo
        id: pull
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data pull
      # Reads NSE's free filing lists, works out what each company needs (state/library_state.json),
      # fetches that -- most-needed first, within the 70-minute time budget and the BharatStock
      # daily budget -- then rescores every company from stored figures and today's prices.
      - name: Score the stock library
        id: score
        env:
          BHARATSTOCK_API_KEY: ${{ secrets.BHARATSTOCK_API_KEY }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL }}     # same relay the daily job uses; mode=alert emails a new discovery-tier finding
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          set -o pipefail
          python -m hub.library | tee /tmp/library_result.json
          python -c "
          import json
          r = json.load(open('/tmp/library_result.json'))
          print('cycle_complete=' + str(r.get('cycle_complete', False)))
          print('processed=' + str(r.get('processed', 0)))
          print('more_work=' + str(r.get('more_work', False)))
          " >> "$GITHUB_OUTPUT"
      - name: Save the daily price files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/bhav
          key: bhav-${{ github.run_id }}
      - name: Save the private data (site/, state/) to the private repo
        if: always() && steps.pull.outcome == 'success'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data push "multi-bagger (via library batch) $(date -u +%F)"
      # more_work: companies still need something this run could not finish in its time budget AND
      # this run made progress. Work that only BharatStock can do, once the day's allowance is used,
      # is not "more work" -- it waits for tomorrow's scheduled run instead of re-dispatching every
      # minute (seen 8 Oct before the first guard existed).
      - name: Continue with another run
        if: steps.score.outputs.more_work == 'True'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run library.yml --repo "$GITHUB_REPOSITORY"
