name: breeze

# ICICI Direct Breeze history (13 Nov 2026; hub/breeze.py). ICICI accepts the API key only from the fixed address
# 130.210.31.37 (the owner's free Oracle Cloud server), so this job opens an SSH tunnel to that server and sends its
# ICICI requests through it. Needs today's ICICI sign-in (the login link -> phone app -> relay).
# Secrets: BREEZE_API_KEY, BREEZE_API_SECRET, ORACLE_SSH_KEY, RELAY_URL, RELAY_KEY, PRIVATE_REPO_TOKEN.
# Public log: counts and dates only, never prices or keys.
on:
  workflow_dispatch:
    inputs:
      module:
        description: "hub module to run (e.g. diag_breeze)"
        required: true
        default: "diag_breeze"
      budget:
        description: "most ICICI requests this run (breeze_history)"
        required: false
        default: "4000"

permissions:
  contents: read

concurrency:
  group: breeze
  cancel-in-progress: false

jobs:
  breeze:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "requests[socks]>=2.31"
      - name: Today's ICICI sign-in from the relay
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          for attempt in 1 2 3; do
            R=$(curl -sSL -G "$RELAY_URL" --data-urlencode "mode=breeze_session" --data-urlencode "key=$RELAY_KEY" || true)
            S=$(printf '%s' "$R" | python -c 'import sys,json; print(json.load(sys.stdin).get("session",""))' 2>/dev/null || true)
            [ -n "$S" ] && break
            sleep $((attempt * 5))
          done
          if [ -z "$S" ]; then
            echo "::error title=ICICI sign-in::No ICICI sign-in today. Open the ICICI login link, sign in, and run this again."
            printf '%s' "$R" | python -c 'import sys,json; d=json.load(sys.stdin); print({k: d.get(k) for k in ("error","day","today")})' 2>/dev/null || true
            exit 1
          fi
          echo "::add-mask::$S"
          echo "BREEZE_SESSION=$S" >> "$GITHUB_ENV"
      - name: Tunnel to the fixed address (Oracle server)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle.key
          chmod 600 ~/.ssh/oracle.key
          ssh -i ~/.ssh/oracle.key -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ExitOnForwardFailure=yes \
              -f -N -D 1080 opc@130.210.31.37
          IP=$(curl -sS --max-time 20 --socks5-hostname 127.0.0.1:1080 https://api.ipify.org)
          echo "Requests leave from: $IP"
          [ "$IP" = "130.210.31.37" ] || { echo "::error title=Tunnel::requests do not leave from the fixed address"; exit 1; }
          echo "BREEZE_PROXY=socks5h://127.0.0.1:1080" >> "$GITHUB_ENV"
      - run: python -m "hub.${{ inputs.module }}"
        env:
          BREEZE_API_KEY: ${{ secrets.BREEZE_API_KEY }}
          BREEZE_API_SECRET: ${{ secrets.BREEZE_API_SECRET }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          BUDGET: ${{ inputs.budget }}
