name: live-quotes

# Every 5 minutes during Indian market hours (08:30–16:30 IST, Mon–Fri).
on:
  schedule:
    - cron: "*/5 3-11 * * 1-5"    # 03:00–11:55 UTC = 08:30–17:25 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One Kite request per refresh for the whole platform (13 Oct 2026): every step below reads the relay's shared
      # 10-second Kite snapshot (relay/Market.gs); this job no longer logs in to Kite itself. Run back to back, the
      # three steps share one snapshot.
      # Watchlist move emails (11 Oct 2026): 4%+ (and again at 8%) since yesterday's close, once per
      # company per step per day (relay Alerts.gs; switchable on the dashboard).
      - name: Check the watchlist for big moves
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: curl -s -L -G --max-time 40 "$RELAY_URL" --data-urlencode "mode=watch_check" --data-urlencode "key=$RELAY_KEY" > /dev/null || true

      # live.json from the relay's ?mode=quote. Also the Kite login alarm (11 Oct 2026): a login another Kite login
      # replaced is caught on this call and emailed (relay KiteWatch.gs).
      - name: Write live quotes
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: python -m hub.live

      # Expiry meter (13 Oct 2026): records the meter's reading and, after 15:45 IST, the close it learns from; writes the
      # phone's expiry.json from the same answer (relay Expiry.gs). No-op on other days.
      - name: Expiry meter reading
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python -m hub.expiry_day || echo "::warning::expiry meter reading failed"

      - name: Commit live quotes
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/live.json; [ -f docs/data/expiry.json ] && git add docs/data/expiry.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "live quotes $(date -u +%FT%TZ)"
            git pull -q --rebase origin main
            git push -q origin main
          fi
