name: kite-reminder

# Kite login reminder, pushed to the owner's iPhone through the Market Hub PWA (hub/push.py, 14 Oct
# 2026). Runs twice on weekday mornings: after Kite's own ~07:30 IST morning token clear-out, before
# the 09:05 IST close of the window the owner is asked to log in by. hub.push itself skips NSE
# holidays and skips if Kite is already logged in today (both checked live, not by this schedule).
# workflow_dispatch with mode=test ignores both checks and sends a "push notifications are working"
# test to every subscribed device. Setup: run mode=test once (the first run creates the VAPID key pair
# and stores it on the relay -- no secrets to add), then tap "Turn on notifications" on the phone, then
# run mode=test again. The VAPID_* secrets below are optional; if both are set they take precedence.
# Each run's result is also a ::notice annotation on the run.
on:
  schedule:
    - cron: "6 2 * * 1-5"    # 02:06 UTC = 07:36 IST, Mon-Fri
    - cron: "3 3 * * 1-5"    # 03:03 UTC = 08:33 IST, Mon-Fri
  workflow_dispatch:
    inputs:
      mode:
        description: "send (the real reminder) or test (ignores the holiday/already-logged-in checks)"
        required: false
        default: "send"

permissions:
  contents: read

jobs:
  # 14 Nov 2026: GitHub started scheduled runs 6-9 hours late from 6 Nov. The trading machine starts this job on time
  # through the relay (trader/kicker.py); the schedule above is the backup and stops here when the machine did it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          r=$(curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=kick_seen" --data-urlencode "wf=kite-reminder.yml" --data-urlencode "key=$RELAY_KEY" || true)
          skip=$(printf '%s' "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("yes" if d.get("alive") and d.get("last_ok") else "no")' 2>/dev/null || echo no)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = yes ]; then echo "::notice title=late schedule skipped::the trading machine started this job on time"; else echo "machine clock not confirmed: running as scheduled"; fi

  push:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'yes' }}
    concurrency:                # on the job, not the workflow: a late schedule skipped above never touches it
      group: kite-reminder
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send the Kite login reminder
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: python -m hub.push "${{ github.event.inputs.mode || 'send' }}"
