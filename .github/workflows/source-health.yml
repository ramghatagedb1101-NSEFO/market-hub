name: source-health

# Daily source check (17 Oct 2026, hub/source_health.py): data files that stopped changing, insights sections that are
# empty or old, and scheduled jobs whose last run failed. Emails only when the problems change, or every 3 days while
# one lasts.
on:
  schedule:
    - cron: "40 3 * * 1-6"       # 03:40 UTC = 09:10 IST, Mon-Sat: after the library (06:15) and insights (08:05) runs
  workflow_dispatch:

permissions:
  contents: read
  actions: read                  # to see the scheduled jobs' latest runs

jobs:
  # 14 Nov 2026: GitHub started scheduled runs 6-9 hours late from 6 Nov. The trading machine starts this job on time
  # through the relay (trader/kicker.py); the schedule above is the backup and stops here when the machine did it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          r=$(curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=kick_seen" --data-urlencode "wf=source-health.yml" --data-urlencode "key=$RELAY_KEY" || true)
          skip=$(printf '%s' "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("yes" if d.get("alive") and d.get("last_ok") else "no")' 2>/dev/null || echo no)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = yes ]; then echo "::notice title=late schedule skipped::the trading machine started this job on time"; else echo "machine clock not confirmed: running as scheduled"; fi

  check:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the data sources
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python -m hub.source_health | tee /tmp/health.json
          python -c "import json; s=open('/tmp/health.json').read(); r=json.loads(s[s.find('{'):]); print('::notice title=source health::' + json.dumps({k: r[k] for k in ('problems','new','fixed','mailed')}))"
