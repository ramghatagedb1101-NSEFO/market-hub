name: ai-summaries

# AI summaries of earnings-call transcripts and annual reports for the admin stock report (hub/summaries.py).
# On demand: the report's "Summarise" button dispatches this with the company's symbol (through the relay's
# GH_PAT). Daily: the newest transcripts of companies scoring 3+ on the multi-bagger screen, capped by
# AI_DAILY_LIMIT. Default model: Google Gemini's free tier (GEMINI_API_KEY secret); Claude is an option
# (repository variable AI_PROVIDER=anthropic + ANTHROPIC_API_KEY). Without the key the company's entry says so.
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "NSE symbol to summarise (blank = the daily selection)"
        required: false
        default: ""
  schedule:
    - cron: "30 3 * * *"            # 03:30 UTC = 09:00 IST, after the 06:15 library run has listed new documents

permissions:
  contents: read

jobs:
  # 14 Nov 2026: GitHub started scheduled runs 6-9 hours late from 6 Nov. The trading machine starts this job on time
  # through the relay (trader/kicker.py); the schedule above is the backup and stops here when the machine did it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          r=$(curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=kick_seen" --data-urlencode "wf=summaries.yml" --data-urlencode "key=$RELAY_KEY" || true)
          skip=$(printf '%s' "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("yes" if d.get("alive") and d.get("last_ok") else "no")' 2>/dev/null || echo no)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = yes ]; then echo "::notice title=late schedule skipped::the trading machine started this job on time"; else echo "machine clock not confirmed: running as scheduled"; fi

  summarise:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'yes' }}
    concurrency:                # on the job, not the workflow: a late schedule skipped above never touches it
      group: summaries
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Bring the private data (site/, state/) from the private repo
        id: pull
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data pull
      - name: Summarise
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SYMBOL: ${{ github.event.inputs.symbol }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}   # its progress report (source_health.report_progress)
        run: python -m hub.summaries
      - name: Save the summaries to the private repo
        if: always() && steps.pull.outcome == 'success'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data push "AI summaries $(TZ=Asia/Kolkata date +%F)"
