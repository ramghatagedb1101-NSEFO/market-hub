name: oci-launch

# Keeps asking Oracle for the free Arm machine (market-hub-trader, 4 OCPU / 24 GB) until Mumbai has room, then switches
# itself off (13 Nov 2026; infra/oci_launch.py). "No capacity" ends the run green; only real errors are red.
# Secrets: OCI_API_KEY (the owner's API private key), OCI_TENANCY, OCI_USER, OCI_FINGERPRINT, OCI_SSH_PUBKEY.
on:
  schedule:
    # Off-peak minutes: GitHub never started the "*/5" schedule (13 Nov 2026, none in 2.5 hours); a fresh
    # schedule line re-registers it.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: oci-launch
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    # One run keeps asking every 2 minutes for 5.5 hours, then starts the next run itself (14 Nov 2026): GitHub did
    # not start the scheduled runs at all, so the schedule above is only a backup.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "oci>=2.130"
      - name: Ask Oracle for the machine
        id: launch
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
          OCI_REGION: ap-mumbai-1
        run: |
          printf '%s\n' "$OCI_API_KEY" > "$RUNNER_TEMP/oci.pem"
          chmod 600 "$RUNNER_TEMP/oci.pem"
          set +e
          end=$(( $(date +%s) + 19800 ))
          tries=0
          while :; do
            tries=$((tries + 1))
            OCI_KEY_FILE="$RUNNER_TEMP/oci.pem" python infra/oci_launch.py
            code=$?
            if [ "$code" != 75 ] || [ "$(date +%s)" -ge "$end" ]; then break; fi
            sleep 120
          done
          rm -f "$RUNNER_TEMP/oci.pem"
          echo "asked $tries times"
          if [ "$code" = 75 ]; then echo "again=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" = 0 ]; then echo "done=yes" >> "$GITHUB_OUTPUT"; fi
          exit $code
      - name: "Still no room: start the next run"
        if: steps.launch.outputs.again == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run oci-launch.yml --repo "${{ github.repository }}" --ref main
      - name: "Machine exists: stop asking"
        if: steps.launch.outputs.done == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable oci-launch.yml --repo "${{ github.repository }}"
