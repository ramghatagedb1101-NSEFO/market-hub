name: bulk-deals-daily

# NSE's bulk-deal file covers the current day only, so this collector builds the history day by day.
on:
  schedule:
    - cron: "30 12 * * 1-5"       # 12:30 UTC = 18:00 IST, weekdays, after the day's deals are published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bulk-deals
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect today's bulk deals
        run: python -m hub.bulkdeals

      - name: Commit bulk-deal history
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add state/bulk_deals.csv docs/data/bulk_deals.json
          if git diff --cached --quiet; then
            echo "No new bulk deals to commit"
          else
            git commit -m "bulk deals $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -q origin main && git push && break
              sleep 5
            done
            git fetch -q origin
            git merge-base --is-ancestor HEAD origin/main || { echo "save failed: bulk-deal commit did not reach main"; exit 1; }
          fi
