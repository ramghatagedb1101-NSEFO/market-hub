name: expiry-history

# Expiry history test (13 Oct 2026; hub/expiry_history.py): do option sellers' walls and max pain, read the evening
# before, predict where NIFTY and BANK NIFTY settle on expiry day, beyond the open? Fits the expiry meter's starting
# weights from ~3 years of NSE's free end-of-day F&O files. NSE blocks the owner's laptop, so it runs here.
# Run by hand. Results: private repository state/expiry_history/ (records.json, summary.json) and this run's summary.
# Later runs fetch only expiries not yet recorded (about one NSE request a second; a first 3-year run ~500 requests).
on:
  workflow_dispatch:
    inputs:
      start:
        description: "first expiry date to cover (yyyy-mm-dd)"
        required: false
        default: "2023-10-01"
      budget:
        description: "most NSE requests this run"
        required: false
        default: "1500"

permissions:
  contents: read

concurrency:
  group: expiry-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Expiry history test
        env:
          START: ${{ inputs.start }}
          BUDGET: ${{ inputs.budget }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.expiry_history
