name: bharat-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Five mid and small caps, one call each
        env:
          BHARATSTOCK_API_KEY: ${{ secrets.BHARATSTOCK_API_KEY }}
        run: |
          for T in AWL AARTIIND ABSLAMC AETHER AFFLE; do
            curl -sS -H "X-API-Key: $BHARATSTOCK_API_KEY" \
              "https://bharatstockapi.com/v1/stocks/$T/financials?period_type=quarterly" \
              -o "$T.json" -w "$T HTTP %{http_code}\n"
          done
          python - <<'PY'
          import json, glob
          for f in sorted(glob.glob("*.json")):
              d = json.load(open(f))
              rows = d.get("data", d if isinstance(d, list) else [])
              print(f, "rows:", len(rows))
              if rows:
                  print("  keys:", sorted(rows[0].keys()))
                  for r in rows[:2]:
                      print("  ", {k: r.get(k) for k in r if k in ("period_end_date", "revenue", "net_profit", "eps", "total_income", "consolidation_type")})
          PY
