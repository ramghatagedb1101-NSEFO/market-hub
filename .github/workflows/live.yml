name: live-quotes

# Every 5 minutes during Indian market hours (08:30–16:30 IST, Mon–Fri).
on:
  schedule:
    - cron: "*/5 3-11 * * 1-5"    # 03:00–11:55 UTC = 08:30–17:25 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 14 Nov 2026: GitHub started scheduled runs 6-9 hours late from 6 Nov. The trading machine starts this job on time
  # through the relay (trader/kicker.py); the schedule above is the backup and stops here when the machine did it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          r=$(curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=kick_seen" --data-urlencode "wf=live.yml" --data-urlencode "key=$RELAY_KEY" || true)
          skip=$(printf '%s' "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("yes" if d.get("alive") and d.get("last_ok") else "no")' 2>/dev/null || echo no)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = yes ]; then echo "::notice title=late schedule skipped::the trading machine started this job on time"; else echo "machine clock not confirmed: running as scheduled"; fi

  quotes:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'yes' }}
    concurrency:                # on the job, not the workflow: a late schedule skipped above never touches it
      group: live-quotes
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # One Kite request per refresh for the whole platform (13 Oct 2026): every step below reads the relay's shared
      # 10-second Kite snapshot (relay/Market.gs); this job no longer logs in to Kite itself. Run back to back, the
      # three steps share one snapshot.
      # Watchlist move emails (11 Oct 2026): 4%+ (and again at 8%) since yesterday's close, once per
      # company per step per day (relay Alerts.gs; switchable on the dashboard).
      - name: Check the watchlist for big moves
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: curl -s -L -G --max-time 40 "$RELAY_URL" --data-urlencode "mode=watch_check" --data-urlencode "key=$RELAY_KEY" > /dev/null || true

      # Paper trading (17 Oct 2026): working limit and stop-loss orders fill when the price is reached (relay Paper.gs).
      - name: Check working paper orders
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: curl -s -L -G --max-time 40 "$RELAY_URL" --data-urlencode "mode=paper_check" --data-urlencode "key=$RELAY_KEY" > /dev/null || true

      # live.json from the relay's ?mode=quote. Also the Kite login alarm (11 Oct 2026): a login another Kite login
      # replaced is caught on this call and emailed (relay KiteWatch.gs).
      - name: Write live quotes
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
        run: python -m hub.live

      # Expiry meter (13 Oct 2026): records the meter's reading and, after 15:45 IST, the close it learns from; writes the
      # phone's expiry.json from the same answer (relay Expiry.gs). No-op on other days.
      - name: Expiry meter reading
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: python -m hub.expiry_day || echo "::warning::expiry meter reading failed"

      - name: Commit live quotes
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/live.json; [ -f docs/data/expiry.json ] && git add docs/data/expiry.json
          [ -f docs/data/expiry_score.json ] && git add docs/data/expiry_score.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "live quotes $(TZ=Asia/Kolkata date +'%F %H:%M IST')"
            git pull -q --rebase origin main
            git push -q origin main
          fi
