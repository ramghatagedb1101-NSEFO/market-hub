name: backtest-multibagger
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Back-test the multi-bagger gates (summary statistics only)
        env:
          BHARATSTOCK_API_KEY: ${{ secrets.BHARATSTOCK_API_KEY }}
        run: python -m hub.backtest_multibagger
      - name: Commit the summary
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add docs/data/backtest_multibagger.json
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "multibagger back-test summary"
            for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          fi
