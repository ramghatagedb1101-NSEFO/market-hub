name: expiry-theta

# Expiry-day theta harvest (hub/expiry_theta.py): EXPERIMENTAL, UNVALIDATED, a different risk
# profile from everything else in this repo -- see that module's docstring before changing anything
# here. Runs three times during market hours on Mondays and Tuesdays: NIFTY expires on Tuesday, or on
# Monday when Tuesday is a holiday (Mon 19 Oct and Mon 9 Nov 2026; 14 Oct 2026: Tuesday-only missed those). The
# script re-checks the live option chain for an actual expiry today and no-ops on other days. Morning:
# a new suggestion. Midday and afternoon: a hold/exit read on whatever the morning run suggested.
on:
  schedule:
    - cron: "30 4 * * 1-2"    # 04:30 UTC = 10:00 IST: entry decision, after the opening session settles
    - cron: "0 7 * * 1-2"     # 07:00 UTC = 12:30 IST: midday hold/exit check
    - cron: "15 9 * * 1-2"    # 09:15 UTC = 14:45 IST: final hold/exit check, ~45 min before the close
  workflow_dispatch:        # manual run any day, for testing -- the script no-ops if NIFTY has no expiry today

permissions:
  contents: read

jobs:
  # 14 Nov 2026: GitHub started scheduled runs 6-9 hours late from 6 Nov. The trading machine starts this job on time
  # through the relay (trader/kicker.py); the schedule above is the backup and stops here when the machine did it.
  gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - id: g
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          r=$(curl -s -L -G --max-time 60 "$RELAY_URL" --data-urlencode "mode=kick_seen" --data-urlencode "wf=expiry-theta.yml" --data-urlencode "key=$RELAY_KEY" || true)
          skip=$(printf '%s' "$r" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("yes" if d.get("alive") and d.get("last_ok") else "no")' 2>/dev/null || echo no)
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = yes ]; then echo "::notice title=late schedule skipped::the trading machine started this job on time"; else echo "machine clock not confirmed: running as scheduled"; fi

  run:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'yes' }}
    concurrency:                # on the job, not the workflow: a late schedule skipped above never touches it
      group: expiry-theta
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bring the private data (site/, state/) from the private repo
        id: pull
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data pull

      - name: Fetch today's Kite access token from the relay
        run: |
          CHECK=$(curl -sSL -G "$RELAY_URL" -w " HTTP:%{http_code}" --data-urlencode "mode=check" --data-urlencode "key=$RELAY_KEY" || true)
          echo "Relay setup check: $CHECK"
          TOKEN=""
          for attempt in 1 2 3 4; do
            RESP=$(curl -sSL -G "$RELAY_URL" -w " HTTP:%{http_code}" --data-urlencode "mode=token" --data-urlencode "key=$RELAY_KEY" || true)
            TOKEN=$(echo "$RESP" | sed 's/ HTTP:[0-9]*$//' | python -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)
            if [ -n "$TOKEN" ]; then break; fi
            echo "Attempt $attempt: no token yet. Relay answered: $RESP"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 5)); fi
          done
          if [ -z "$TOKEN" ]; then echo "No Kite token for today after 4 attempts. Last relay answer: $RESP"; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "KITE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}

      - name: Expiry-day theta harvest (NIFTY iron condor, suggestion or hold/exit read)
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
        run: python -m hub.expiry_theta

      - name: Save the private data (site/, state/) to the private repo
        if: always() && steps.pull.outcome == 'success'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m hub.site_data push "expiry-theta $(TZ=Asia/Kolkata date +'%F %H:%M IST')"
