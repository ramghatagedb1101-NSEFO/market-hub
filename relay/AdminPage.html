const SEC = { sel: '', sort: 'composite', dir: -1 };
function median(xs){ const a = xs.filter(x => x != null && isFinite(x)).sort((p, q) => p - q); return a.length ? a[Math.floor(a.length / 2)] : null; }
function sectorStats(){
  const by = {};
  S.lib.stocks.forEach(s => { if (!s.cells) return; const ind = industryOf(s.symbol); if (!ind) return; (by[ind] = by[ind] || []).push(s); });
  return Object.keys(by).map(ind => { const ss = by[ind];
    return { ind, n: ss.length, mcap: ss.reduce((a, s) => a + (val(s, 'market_value_bucket') || 0), 0),
      rev: median(ss.map(s => val(s, 'rev_yoy'))), profit: median(ss.map(s => val(s, 'profit_yoy'))), margin: median(ss.map(s => val(s, 'net_margin'))),
      roe: median(ss.map(s => val(s, 'roe'))), pe: median(ss.map(s => { const x = val(s, 'pe'); return x > 0 ? x : null; })), r12: median(ss.map(s => val(s, 'ret_12m'))),
      composite: median(ss.map(s => fac(s.symbol, 'composite'))), comp: ss.filter(s => isCompounder(s.symbol)).length,
      mb: ss.filter(s => ((S.mbBySym[s.symbol] || {}).score || 0) >= 3).length, stocks: ss }; });
}
function secSort(k){ if (SEC.sort === k) SEC.dir *= -1; else { SEC.sort = k; SEC.dir = -1; } rerender(); }
function secPick(ind){ SEC.sel = SEC.sel === ind ? '' : ind; rerender(); }
function heat(v, all, better){
  if (v == null) return '';
  const xs = all.filter(x => x != null).sort((a, b) => a - b); if (xs.length < 3) return '';
  let r = xs.filter(x => x < v).length / (xs.length - 1); if (better < 0) r = 1 - r;
  const c = r >= 0.5 ? cssVar('--up') : cssVar('--down'); const a = Math.round(Math.abs(r - 0.5) * 2 * 38);
  return 'background:' + c + (a < 16 ? '0' : '') + a.toString(16) + ';';
}
function pageSectors(){
  const v = $('view');
  if (S.libErr) { v.innerHTML = errBlock(S.libErr); return; }
  if (!S.lib) { v.innerHTML = loadingBlock('Loading the library…'); return; }
  if (!S.industries) { v.innerHTML = loadingBlock('Loading…'); return; }
  destroyCharts();
  const rows = sectorStats();
  // Industries with fewer than 5 companies are too small for medians to mean much: ranked last, faded, kept out of the chart.
  const SMALL = 5;
  const g = r => r[SEC.sort]; rows.sort((a, b) => { if ((a.n < SMALL) !== (b.n < SMALL)) return a.n < SMALL ? 1 : -1;
    const x = g(a), y = g(b); if (x == null) return 1; if (y == null) return -1; return (x < y ? -1 : x > y ? 1 : 0) * SEC.dir; });
  const cols = [['n', 'Companies', 0, v => num(v, 0)], ['mcap', 'Total mkt cap', 0, v => crore(v)], ['rev', 'Revenue gr.', 1, v => pct(v)], ['profit', 'Profit gr.', 1, v => pct(v)], ['margin', 'Net margin', 1, v => v == null ? '–' : num(v, 1) + '%'],
                ['roe', 'ROE', 1, v => v == null ? '–' : num(v, 1) + '%'], ['pe', 'P/E', -1, v => v == null ? '–' : num(v, 1) + '×'], ['r12', '12M return', 1, v => pct(v)], ['composite', 'Composite', 1, v => v == null ? '–' : String(v)], ['comp', 'Compounders', 0, v => v || '–'], ['mb', 'Multibaggers 3+', 0, v => v || '–']];
  const covered = rows.reduce((a, r) => a + r.n, 0);
  let html = '<div class="page-head"><div><p class="sub">Medians by industry for ' + num(covered, 0) + ' NIFTY Total Market companies. Industries with fewer than 5 companies are faded. Click an industry for its companies.</p></div></div>' +
    '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Median 12-month return by industry</h3></div><div class="panel-b"><div style="position:relative;height:' + Math.max(260, rows.length * 22 + 40) + 'px"><canvas id="cSec"></canvas></div></div></div>' +
    '<div class="tbl-wrap" style="max-height:none;margin-bottom:14px"><table class="t"><thead><tr><th class="l sortable" onclick="secSort(\'ind\')">Industry</th>' + cols.map(([k, l]) => '<th class="sortable" onclick="secSort(\'' + k + '\')">' + l + (SEC.sort === k ? (SEC.dir < 0 ? ' ↓' : ' ↑') : '') + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr class="click"' + (r.n < SMALL ? ' title="Fewer than ' + SMALL + ' companies: medians are not reliable" style="opacity:.55"' : '') + ' onclick="secPick(\'' + esc(r.ind).replace(/'/g, '\\\'') + '\')"' + (SEC.sel === r.ind ? ' style="outline:2px solid var(--brand);outline-offset:-2px"' : '') + '><td class="l"><b>' + esc(r.ind) + '</b></td>' +
      cols.map(([k, , better, f]) => '<td class="num" style="' + (better && r.n >= SMALL ? heat(r[k], rows.filter(x => x.n >= SMALL).map(x => x[k]), better) : '') + '">' + f(r[k]) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
  const sel = rows.find(r => r.ind === SEC.sel);
  if (sel) {
    const ss = sel.stocks.slice().sort((a, b) => (fac(b.symbol, 'composite') || -1) - (fac(a.symbol, 'composite') || -1));
    html += '<div class="panel"><div class="panel-h"><h3>' + esc(sel.ind) + ' — ' + sel.n + ' companies, best composite score first</h3><a href="javascript:void 0" onclick="secPick(\'\')">Close</a></div><table class="t"><tr><th class="l">Company</th><th>Mkt cap</th><th>P/E</th><th>Revenue gr.</th><th>Profit gr.</th><th>Net margin</th><th>12M</th><th>Composite</th></tr>' +
      ss.map(s => '<tr class="click" onclick="openStock(\'' + esc(s.symbol) + '\')"><td class="l">' + companyCell(s.symbol) + '</td><td class="num">' + crore(val(s, 'market_value_bucket')) + '</td><td class="num">' + (val(s, 'pe') > 0 ? num(val(s, 'pe'), 1) + '×' : '–') + '</td><td class="num ' + cls(val(s, 'rev_yoy')) + '">' + pct(val(s, 'rev_yoy')) + '</td><td class="num ' + cls(val(s, 'profit_yoy')) + '">' + pct(val(s, 'profit_yoy')) + '</td><td class="num">' + (val(s, 'net_margin') == null ? '–' : num(val(s, 'net_margin'), 1) + '%') + '</td><td class="num ' + cls(val(s, 'ret_12m')) + '">' + pct(val(s, 'ret_12m')) + '</td><td>' + scoreChip(fac(s.symbol, 'composite')) + '</td></tr>').join('') + '</table></div>';
  }
  v.innerHTML = html;
  const el = $('cSec');
  if (el && typeof Chart !== 'undefined') {
    const rr = rows.filter(r => r.r12 != null && r.n >= SMALL).sort((a, b) => b.r12 - a.r12);
    const up = cssVar('--up'), down = cssVar('--down'), tick = cssVar('--muted'), grid = cssVar('--line2');
    charts.push(new Chart(el, { type: 'bar', data: { labels: rr.map(r => r.ind), datasets: [{ data: rr.map(r => Math.round(r.r12 * 10) / 10), backgroundColor: rr.map(r => r.r12 >= 0 ? up : down), borderRadius: 3, barThickness: 14 }] },
      options: { indexAxis: 'y', maintainAspectRatio: false, onClick: (e, els) => { if (els.length) secPick(rr[els[0].index].ind); },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => 'Median 12M return ' + pct(c.parsed.x) + ' · ' + rr[c.dataIndex].n + ' companies' } } },
        scales: { x: { grid: { color: grid }, ticks: { color: tick, callback: v => v + '%' } }, y: { grid: { display: false }, ticks: { color: tick, font: { size: 11.5 } } } } } }));
  }
}

// ---------------- Stock report additions: factor profile and peers ----------------
function peersOf(sym){
  const ind = industryOf(sym), me = S.bySym[sym], mc = val(me, 'market_value_bucket');
  if (!me || !me.cells || !mc) return { basis: null, list: [] };
  const pool = S.lib.stocks.filter(s => s.cells && s.symbol !== sym && val(s, 'market_value_bucket') > 0 && (ind ? industryOf(s.symbol) === ind : !industryOf(s.symbol)));
  pool.sort((a, b) => Math.abs(Math.log(val(a, 'market_value_bucket') / mc)) - Math.abs(Math.log(val(b, 'market_value_bucket') / mc)));
  return { basis: ind ? 'same industry (' + ind + '), closest in size' : 'closest in size', list: pool.slice(0, 6) };
}
function factorPanel(sym){
  const f = S.fac && S.fac[sym];
  if (!f || f.composite == null) return '';
  const ind = industryOf(sym);
  return '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Factor profile</h3><span class="muted" style="font-size:12px">0–100 vs all companies' + (ind ? ' · dashed = ' + esc(ind) + ' median' : '') + '</span></div>' +
    '<div class="grid g2" style="gap:0"><div class="panel-b" style="border-right:1px solid var(--line2)"><div class="chart sm" style="height:240px"><canvas id="cRadar"></canvas></div></div>' +
    '<div class="panel-b">' + [['composite', 'Composite']].concat(FACTORS.map(x => [x[0], x[1]])).map(([k, l]) => '<div class="metric" style="grid-template-columns:1fr auto"><span class="n"' + (k === 'composite' ? ' style="font-weight:700;color:var(--text)"' : '') + '>' + l + '</span><span>' + scoreChip(f[k]) + '</span>' +
      (k !== 'composite' && f[k] != null ? '<span class="pct"><span class="track"><i style="left:' + f[k] + '%"></i></span><span style="min-width:116px;text-align:right">' + (f[k] >= 70 ? 'strong' : f[k] >= 40 ? 'middling' : 'weak') + '</span></span>' : '') + '</div>').join('') + '</div></div></div>';
}
function peersPanel(sym){
  if (!S.lib) return '';
  const p = peersOf(sym);
  if (!p.list.length) return '';
  const rows = [S.bySym[sym], ...p.list];
  const cols = [['market_value_bucket', 'Mkt cap'], ['pe', 'P/E'], ['rev_yoy', 'Revenue gr.'], ['profit_yoy', 'Profit gr.'], ['net_margin', 'Net margin'], ['roe', 'ROE'], ['ret_12m', '12M']];
  const best = {}; cols.forEach(([k]) => { const d = dirOf(k); const xs = rows.map(s => val(s, k)).filter(x => x != null && (k !== 'pe' || x > 0)); if (xs.length > 1 && k !== 'market_value_bucket') best[k] = d < 0 ? Math.min(...xs) : Math.max(...xs); });
  return '<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Peers</h3><span class="muted" style="font-size:12px">' + esc(p.basis) + ' · bold = best in group</span></div><div class="tbl-wrap" style="border:0;box-shadow:none;border-radius:0;max-height:none"><table class="t"><tr><th class="l">Company</th>' + cols.map(([, l]) => '<th>' + l + '</th>').join('') + '<th>Composite</th></tr>' +
    rows.map((s, i) => '<tr class="' + (i ? 'click' : '') + '"' + (i ? ' onclick="openStock(\'' + esc(s.symbol) + '\')"' : ' style="background:var(--brand-soft)"') + '><td class="l">' + companyCell(s.symbol) + '</td>' +
      cols.map(([k]) => { const x = val(s, k); return '<td class="num' + (best[k] != null && x === best[k] ? '" style="font-weight:800' : '') + '">' + (k === 'pe' && !(x > 0) ? '–' : fmtMeasure(k, x)) + '</td>'; }).join('') + '<td>' + scoreChip(fac(s.symbol, 'composite')) + '</td></tr>').join('') + '</table></div></div>';
}
function drawRadar(sym){
  const el = $('cRadar'); const f = S.fac && S.fac[sym];
  if (!el || !f || typeof Chart === 'undefined') return;
  const ind = industryOf(sym);
  const labels = FACTORS.map(x => x[1]);
  const me = FACTORS.map(([k]) => f[k]);
  const ds = [{ label: sym, data: me, borderColor: cssVar('--brand'), backgroundColor: cssVar('--brand') + '33', borderWidth: 2, pointRadius: 3 }];
  if (ind) {
    const peers = S.lib.stocks.filter(s => s.cells && industryOf(s.symbol) === ind);
    ds.push({ label: ind + ' median', data: FACTORS.map(([k]) => median(peers.map(s => fac(s.symbol, k)))), borderColor: cssVar('--faint'), borderDash: [4, 3], backgroundColor: 'transparent', borderWidth: 1.5, pointRadius: 0 });
  }
  charts.push(new Chart(el, { type: 'radar', data: { labels, datasets: ds },
    options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } },
      scales: { r: { min: 0, max: 100, ticks: { stepSize: 25, display: false }, grid: { color: cssVar('--line') }, angleLines: { color: cssVar('--line') }, pointLabels: { color: cssVar('--text2'), font: { size: 11.5 } } } } } }));
}

if (token) start(); else { $('login').style.display = 'flex'; }
