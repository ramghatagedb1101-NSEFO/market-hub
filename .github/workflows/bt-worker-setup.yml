name: bt-worker-setup

# Installs / updates the back-test worker on market-hub-trader (14 Nov 2026; trader/bt_worker.py) and the on-time starts
# for the GitHub jobs (kicker.timer, trader/kicker.py): pulls the code,
# writes /opt/trader/secrets/bt.env (PRIVATE_REPO_TOKEN, RELAY_URL, RELAY_KEY; owner-approved 14 Nov 2026, never
# printed), installs bt-worker.service and (re)starts it. The trading program (trader.service) is not restarted.
# Run by hand, outside market hours. Public log: steps only, never addresses or secrets.
on:
  workflow_dispatch:
    inputs:
      restart_trader:
        description: "also restart the trading program (outside market hours only)"
        type: boolean
        default: false
      log_only:
        description: "only show the worker's last log lines (no pull, no restart)"
        type: boolean
        default: false

concurrency:
  group: algo-sync
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "requests>=2.31" "oci>=2.130"
      - name: Install the worker
        env:
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ap-mumbai-1
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$OCI_API_KEY" > "$RUNNER_TEMP/oci.pem"
          HOST=$(cd infra && OCI_KEY_FILE="$RUNNER_TEMP/oci.pem" python oci_ip.py)
          rm -f "$RUNNER_TEMP/oci.pem"
          echo "::add-mask::$HOST"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/k"
          SSH="ssh -i $RUNNER_TEMP/k -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes ubuntu@$HOST"
          if [ "${{ inputs.log_only }}" = "true" ]; then
            $SSH 'systemctl is-active bt-worker.service; journalctl -u bt-worker.service -n 40 --no-pager -o short-iso'
            $SSH 'systemctl is-active kicker.timer; journalctl -u kicker.service -n 30 --no-pager -o cat | grep -v -e Starting -e Finished -e Deactivated || true'
            rm -f "$RUNNER_TEMP/k"; exit 0
          fi
          $SSH 'cd /opt/trader/app && git pull -q --ff-only && git log --oneline -1 | cut -c1-7'
          printf 'PRIVATE_REPO_TOKEN=%s\nRELAY_URL=%s\nRELAY_KEY=%s\n' "$PRIVATE_REPO_TOKEN" "$RELAY_URL" "$RELAY_KEY" | \
            $SSH 'mkdir -p /opt/trader/secrets /opt/trader/btcache && umask 077 && cat > /opt/trader/secrets/bt.env && chmod 600 /opt/trader/secrets/bt.env'
          $SSH 'sudo cp /opt/trader/app/infra/trader/bt-worker.service /etc/systemd/system/bt-worker.service && sudo systemctl daemon-reload && sudo systemctl enable -q bt-worker.service && sudo systemctl restart bt-worker.service && sleep 5 && systemctl is-active bt-worker.service && journalctl -u bt-worker.service -n 5 --no-pager -o cat'
          # On-time starts for the GitHub jobs (14 Nov 2026, trader/kicker.py): a once-a-minute timer, same secrets file.
          $SSH 'sudo cp /opt/trader/app/infra/trader/kicker.service /opt/trader/app/infra/trader/kicker.timer /etc/systemd/system/ && sudo systemctl daemon-reload && sudo systemctl enable -q --now kicker.timer && systemctl is-active kicker.timer && systemctl list-timers kicker.timer --no-pager | head -2'
          if [ "${{ inputs.restart_trader }}" = "true" ]; then
            H=$(TZ=Asia/Kolkata date +%H%M); D=$(TZ=Asia/Kolkata date +%u)
            if [ "$D" -le 5 ] && [ "$H" -ge 0910 ] && [ "$H" -le 1535 ]; then echo "::warning::market hours: trading program not restarted"
            else $SSH 'sudo systemctl restart trader.service && sleep 5 && systemctl is-active trader.service'; fi
          fi
          rm -f "$RUNNER_TEMP/k"
